# ============================================================
# 全港童軍通告自動化圖書館 v5.6 — GitHub Actions
# 流程：載入 data snapshot → 抓取 → 增量 enrich → 30 日備份 → 更新 data snapshot
# 每日 00:15 HKT；本機補抓亦使用相同 data 協定，不再 commit JSON 到 main。
# 06:00 HKT notify.yml 載入最新 snapshot 後發送通知。
#
# 本 workflow 為純抓取與增量抽取，不執行 notify.py，不需要 VAPID / Supabase secrets。
# ⚠️ enrich 只跑「增量」模式（只抽新入庫 PDF），切勿使用 --all 以免觸發網站封鎖。
# ============================================================

name: Scout Notice Scraper

on:
  # 每日 00:15 HKT 自動執行抓取（16:15 UTC = 00:15 HKT）
  schedule:
    - cron: "15 16 * * *"

  # 手動觸發（隨時測試／補跑用）
  workflow_dispatch:

concurrency:
  group: scout-circulars-scrape-and-push
  cancel-in-progress: false

jobs:
  scrape-and-enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # 避免 runner 上的 urllib / requests 把中文路徑當 latin-1 處理
      PYTHONUTF8: "1"
      # 設定為香港時區（core.py / enrich.py 依賴 HKT 計算 captured_date）
      TZ: "Asia/Hong_Kong"
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load latest complete data snapshot
        run: python tools/data_snapshot.py load

      - name: Install dependencies
        run: |
          # enrich.py 的 OCR fallback 需要 tesseract + poppler
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra poppler-utils
          # ⚠️ 用 .github/requirements-scrape.txt，唔好用根目錄 requirements.txt。
          #    根目錄嗰個係「Vercel Function 部署 runtime 依賴」（刻意留空），
          #    因為 Vercel 會把佢 pip install 入每個 function bundle 而冇
          #    tree-shaking —— playwright 一個套件就係 137MB × 幾十個部署，
          #    2026-09-17 就係咁令 Functions Storage 爆到 11.82GB / 10GB。
          pip install -r .github/requirements-scrape.txt pdfplumber pdfminer.six pillow pytesseract pdf2image
          playwright install chromium

      # ── Step 1: 跑 core.py 抓通告 ──
      - name: Run core scraper
        run: |
          python core.py

      # ── Step 1.5: 加掃 SCOUT APP STORE（只收已上架 visible=true，隱藏唔入）──
      # anon key 唯讀（RLS 限 visible=true），baseline 防舊 app 風暴；已上架→Scout System，隱藏→自動下架
      - name: Scrape SCOUT APP STORE catalogue
        run: |
          python tools/scrape_appstore.py

      # ── Step 2: 跑 enrich.py 增量抽新入庫通告的文字 ──
      # --apply-title-fixes：列表標題同 PDF 真標題對唔上（例如「D-26-05 - 26年10月
      # 區會公布 【New】」其實係「區總部公布」）就寫返 cache.json，並記錄原本列表
      # 標題，之後每次 run 重新套用（core.py 重建 cache 都唔會蓋走）。欄位／檔號／
      # 表格行唔會寫入（enrich.heading_looks_like_title 把關）。
      - name: Run enrich scraper (incremental only)
        run: |
          python enrich.py --verbose --apply-title-fixes

      # ── Step 3: 健康檢查（報告記錄在 Action log）──
      - name: Health check (report only)
        run: |
          python check_stale.py || true

      # ── Step 4: 提交並推送更新 ──
      - name: Back up daily JSON (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: data-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cache.json
            enrich.json
            fingerprints.json
            subscription_stats.json
            appstore.json
            story-queue.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest-only data snapshot
        run: python tools/data_snapshot.py publish
