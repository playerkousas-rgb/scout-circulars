# ============================================================
# 全港童軍通告自動化圖書館 v5.0 — GitHub Actions 定時爬蟲
# ============================================================
# 自動爬蟲已暫時停用（因為 GitHub IP 被部分網站屏蔽）
# 手動觸發仍可用

name: Scout Notice Scraper

on:
  # 自動爬蟲已停用
  # schedule:
  # 每天 UTC 20:00 = 香港時間 04:00
  # - cron: '0 20 * * *'
  # 手動觸發
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python core.py
      - name: Commit & push updated cache + fingerprints
        if: env.SUPABASE_URL == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache.json fingerprints.json
          git diff --staged --quiet || git commit -m "🤖 Daily scrape: $(date +%Y-%m-%d)"
          git push
