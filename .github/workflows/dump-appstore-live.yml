name: Dump App Store Live
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 -c "
          import json, urllib.request
          meta=json.load(open('appstore.json','r',encoding='utf-8'))['_meta']
          url=meta['supabase_url']; key=meta['anon_key']
          req=urllib.request.Request(f\"{url}/rest/v1/apps?select=id,name,url,visible,sort_order,created_at,page,category,tags,description&visible=eq.true&order=sort_order&limit=1000\", headers={'apikey':key,'Authorization': f'Bearer {key}'})
          import json as js
          with urllib.request.urlopen(req,timeout=30) as r:
              apps=js.loads(r.read().decode())
          print(f'TOTAL visible=true: {len(apps)}')
          for a in apps:
              print(f\"{a['name']!r} | {a['url']} | cat={a['category']} page={a['page']} sort={a['sort_order']} visible={a['visible']} created={a.get('created_at')}\")
              print(f\"  tags={a.get('tags')} desc={a.get('description')!r}\")
          # also dump total including hidden to see 59
          req2=urllib.request.Request(f\"{url}/rest/v1/apps?select=id,name,visible&limit=1000\", headers={'apikey':key,'Authorization': f'Bearer {key}'})
          with urllib.request.urlopen(req2,timeout=30) as r2:
              allapps=js.loads(r2.read().decode())
          print(f'ALL total: {len(allapps)} visible_true={sum(1 for x in allapps if x[\"visible\"])} hidden={sum(1 for x in allapps if not x[\"visible\"])}')
          "
      - run: |
          python tools/scrape_appstore.py --help
          python3 -c "import json; d=json.load(open('cache.json')); print('CACHE Scout System', len(d['data']['Scout System'])); [print(x['title'], x['url']) for x in d['data']['Scout System']]"
