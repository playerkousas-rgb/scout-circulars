# ============================================================
# 已啟用：Scout Notice Scraper + App Store（每日 00:15 HKT 同步 App Store）
#
# 此 workflow 現為可選的獨立全量流程，與 scrape.yml 共享 concurrency group，
# 不會雙重 commit（同一時間只跑一個）。已啟用 schedule，與 scrape.yml 一致；
# 兩者擇一即可，日常以 scrape.yml 為主（已含 App Store 同步步驟）。
# 若日後想改以此檔為主，停用 scrape.yml 的 schedule 即可。
#
# 流程：core.py → scrape_appstore.py（只收已上架 visible=true）→ enrich.py → 健康檢查 → commit
# App Store 同步：anon key 唯讀（RLS 限 visible=true），隱藏（visible=false）永遠唔入圖書館
# ============================================================

name: Scout Notice Scraper + App Store

on:
  # 每日 00:15 HKT 自動執行（同 scrape.yml 一致：16:15 UTC）
  schedule:
    - cron: "15 16 * * *"

  # 手動觸發（測試／補跑用）
  workflow_dispatch:

concurrency:
  group: scout-circulars-scrape-and-push
  cancel-in-progress: false

jobs:
  scrape-and-enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUTF8: "1"
      TZ: "Asia/Hong_Kong"
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra poppler-utils
          pip install -r .github/requirements-scrape.txt pdfplumber pdfminer.six pillow pytesseract pdf2image
          playwright install chromium

      # ── Step 1: 跑 core.py 抓通告（同 scrape.yml）──
      - name: Run core scraper
        run: |
          python core.py

      # ── Step 1.5: 加掃 SCOUT APP STORE（只收已上架，隱藏跳過）──
      # anon key 唯讀；baseline 機制保證首次同步唔會派發舊 app 風暴
      - name: Scrape SCOUT APP STORE catalogue
        run: |
          python tools/scrape_appstore.py

      # ── Step 2: enrich 增量（只抽新入庫 PDF）──
      - name: Run enrich scraper (incremental only)
        run: |
          python enrich.py --verbose --apply-title-fixes

      # ── Step 3: 健康檢查 ──
      - name: Health check (report only)
        run: |
          python check_stale.py || true

      # ── Step 4: 提交並推送 ──
      - name: Commit & push updated cache + enrich + fingerprints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache.json enrich.json fingerprints.json
          git diff --cached --quiet || (git commit -m "🤖 Auto-update circulars + appstore [skip ci]" && git push)
