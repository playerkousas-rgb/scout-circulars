# ============================================================
# Manual alternative to scrape.yml (which already includes App Store sync).
# Shared writer lock; latest-only data snapshot, no daily main commits.
# ============================================================

name: Scout Notice Scraper + App Store

on:
  # Manual alternative; scrape.yml already includes App Store.

  # 手動觸發（測試／補跑用）
  workflow_dispatch:

concurrency:
  group: scout-circulars-scrape-and-push
  cancel-in-progress: false

jobs:
  scrape-and-enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUTF8: "1"
      TZ: "Asia/Hong_Kong"
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load latest complete data snapshot
        run: python tools/data_snapshot.py load

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra poppler-utils
          pip install -r .github/requirements-scrape.txt pdfplumber pdfminer.six pillow pytesseract pdf2image
          playwright install chromium

      # ── Step 1: 跑 core.py 抓通告（同 scrape.yml）──
      - name: Run core scraper
        run: |
          python core.py

      # ── Step 1.5: 加掃 SCOUT APP STORE（只收已上架，隱藏跳過）──
      # anon key 唯讀；baseline 機制保證首次同步唔會派發舊 app 風暴
      - name: Scrape SCOUT APP STORE catalogue
        run: |
          python tools/scrape_appstore.py

      # ── Step 2: enrich 增量（只抽新入庫 PDF）──
      - name: Run enrich scraper (incremental only)
        run: |
          python enrich.py --verbose --apply-title-fixes

      # ── Step 3: 健康檢查 ──
      - name: Health check (report only)
        run: |
          python check_stale.py || true

      # ── Step 4: 提交並推送 ──
      - name: Back up daily JSON (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: data-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cache.json
            enrich.json
            fingerprints.json
            subscription_stats.json
            appstore.json
            story-queue.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest-only data snapshot
        run: python tools/data_snapshot.py publish
