name: Data and temporary Story storage tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m unittest test_data_snapshot test_data_snapshot_proxy test_story_storage test_publish_instagram_stories test_story_queue -q
      - run: node test_data_snapshot_frontend.js
