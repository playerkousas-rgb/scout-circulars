name: App Store Live Correct (arena)
on:
  push:
    branches:
      - arena/74af9677-scout-circulars
    paths:
      - 'cache.json'
      - 'tools/scrape_appstore.py'
      - '.github/workflows/appstore-live-correct.yml'
      - '.github/workflows/dump-appstore-live.yml'
permissions:
  contents: write
concurrency:
  group: scout-circulars-scrape-and-push
  cancel-in-progress: false
jobs:
  live-correct:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      TZ: "Asia/Hong_Kong"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/74af9677-scout-circulars
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dump live App Store visible list
        run: |
          python3 -c "
          import json, urllib.request
          meta=json.load(open('appstore.json','r',encoding='utf-8'))['_meta']
          url=meta['supabase_url']; key=meta['anon_key']
          req=urllib.request.Request(f\"{url}/rest/v1/apps?select=id,name,url,visible,sort_order,created_at,category,page,tags,description,icon&visible=eq.true&order=sort_order&limit=1000\", headers={'apikey':key,'Authorization': f'Bearer {key}'})
          import json as js
          with urllib.request.urlopen(req,timeout=30) as r:
              apps=js.loads(r.read().decode())
          print(f'TOTAL visible=true: {len(apps)}')
          for a in apps:
              print(f\"- {a['name']} | {a['url']} | cat={a['category']} page={a['page']} tags={a.get('tags')} created={a.get('created_at')}\")
          req2=urllib.request.Request(f\"{url}/rest/v1/apps?select=id,name,visible&limit=1000\", headers={'apikey':key,'Authorization': f'Bearer {key}'})
          with urllib.request.urlopen(req2,timeout=30) as r2:
              allapps=js.loads(r2.read().decode())
          print(f\"ALL total: {len(allapps)} visible_true={sum(1 for x in allapps if x['visible'])} hidden={sum(1 for x in allapps if not x['visible'])}')
          "
      - name: Live fetch and update cache
        run: |
          python tools/scrape_appstore.py
          python3 -c "import json; d=json.load(open('cache.json')); print('Scout System now', len(d['data']['Scout System'])); [print(x['title'], x['url']) for x in d['data']['Scout System']]"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache.json enrich.json
          git diff --cached --quiet || (git commit -m "🔧 live correct" && git push)
