name: App Store Live Correct (arena)

on:
  push:
    branches:
      - arena/74af9677-scout-circulars
    paths:
      - 'cache.json'
      - 'tools/scrape_appstore.py'
      - '.github/workflows/appstore-live-correct.yml'

permissions:
  contents: write

concurrency:
  group: scout-circulars-scrape-and-push
  cancel-in-progress: false

jobs:
  live-correct:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      TZ: "Asia/Hong_Kong"
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/74af9677-scout-circulars
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Live fetch from Supabase (visible=true only)
        run: |
          python tools/scrape_appstore.py
          echo "--- AFTER LIVE CORRECT ---"
          python3 -c "import json; d=json.load(open('cache.json')); a=d['data'].get('Scout System',[]); print(f'Scout System count={len(a)}'); print(d['_meta'].get('appstore'))"
          python3 -c "import json; e=json.load(open('enrich.json')); print('enrich Scout System', sum(1 for v in e.values() if v.get('source')=='Scout System'))"

      - name: Commit if corrected
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache.json enrich.json
          if git diff --cached --quiet; then
            echo "no change - already correct"
            exit 0
          fi
          git commit -m "🔧 自動對齊線上 App Store 公開清單（live可見 10 項為準，修正 64 項舊快照）"
          git push
