name: App Store Live Correct (arena)
on:
  push:
    branches:
      - arena/74af9677-scout-circulars
    paths:
      - 'cache.json'
      - 'tools/scrape_appstore.py'
      - '.github/workflows/appstore-live-correct.yml'
      - 'tools/dump_live.py'
permissions:
  contents: write
concurrency:
  group: scout-circulars-scrape-and-push
  cancel-in-progress: false
jobs:
  live-correct:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      TZ: "Asia/Hong_Kong"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/74af9677-scout-circulars
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dump live App Store visible list to file
        run: |
          python tools/dump_live.py | tee /tmp/live_dump.txt
          cat /tmp/live_dump.txt
          # Save to repo for inspection
          mkdir -p /tmp/out
          python tools/dump_live.py > live_appstore_dump.txt
          cat live_appstore_dump.txt
      - name: Live fetch and update cache
        run: |
          python tools/scrape_appstore.py
          python3 -c "import json; d=json.load(open('cache.json')); print('Scout System now', len(d['data']['Scout System'])); [print(x['title'], x['url']) for x in d['data']['Scout System']]"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache.json enrich.json live_appstore_dump.txt
          git diff --cached --quiet || (git commit -m "🔧 live correct + dump" && git push)
