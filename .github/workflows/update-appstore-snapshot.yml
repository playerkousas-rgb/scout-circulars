name: Update App Store Snapshot
on:
  schedule:
    - cron: "15 16 * * *"  # same as scrape, keep snapshot fresh
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scout-circulars-scrape-and-push
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/fetch_appstore.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appstore.json
          git diff --cached --quiet || (git commit -m "🔄 更新 App Store snapshot [skip ci]" && git push)
