name: Update App Store Snapshot
on:
  schedule:
    - cron: "15 16 * * *"  # same as scrape, keep snapshot fresh
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scout-circulars-scrape-and-push
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/data_snapshot.py load
      - run: node tools/fetch_appstore.mjs
      - run: python tools/data_snapshot.py publish
