# ============================================================
# 全港童軍通告自動化圖書館 v5.6 — GitHub Actions（僅通知補發）
# 流程：checkout → 安裝最少 notify 依賴 → python notify.py --baseline-ref HEAD
#
# 不執行 core.py / enrich.py，也不需要 Playwright / Chromium / Tesseract。
# 使用 Supabase push_deliveries 去重，並以 rolling recovery window 自動補發。
# ============================================================

name: Scout Notice Notify

on:
  # 每日 06:00 HKT 自動補漏（22:00 UTC = 06:00 HKT）；
  # 使用 rolling recovery window（預設 7 日），若前一日未成功發送，
  # 今日 06:00 會自動連同今日新通告一併補發，無需多次 retry。
  schedule:
    - cron: "0 22 * * *"

  workflow_dispatch:

concurrency:
  group: scout-circulars-scrape-and-push
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      TZ: "Asia/Hong_Kong"
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal notify dependencies
        # 只裝 notify.py / subscription_stats.py 真正用到嘅兩個第三方套件
        # （pywebpush + cryptography），其餘全部標準庫。
        # 絕不安裝 Playwright / Chromium / Tesseract / Poppler / PDF/OCR 套件。
        #
        # ⚠️ 舊寫法 `pip install -r requirements.txt pywebpush cryptography`
        #    口口聲聲話唔裝 Playwright，其實根目錄 requirements.txt 一路都
        #    列住 playwright>=1.52.0（46MB wheel），每次 notify run 都白裝。
        #    而家依賴搬咗去 .github/requirements-notify.txt，真係唔裝了。
        #    根目錄 requirements.txt 係「Vercel Function 部署 runtime 依賴」，
        #    刻意留空 ＋ 已 ignore —— 見 .vercelignore「★ 病源」一節。
        run: |
          pip install -r .github/requirements-notify.txt

      - name: Send Web Push (with rolling catch-up)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SITE_URL: ${{ vars.SITE_URL || 'https://scout-circulars.vercel.app' }}
        run: |
          python notify.py --baseline-ref HEAD

      - name: Build anonymous subscription stats
        # 只輸出彙總數字（人數、各支部／項目訂閱數），不含任何 endpoint 或金鑰。
        # 前端 stats.html 由 raw GitHub 讀取 subscription_stats.json 顯示。
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python subscription_stats.py --out subscription_stats.json

      - name: Commit subscription stats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscription_stats.json
          git diff --cached --quiet || (git commit -m "📊 Update subscription stats [skip ci]" && git pull --rebase && git push)
