# ============================================================
# Daily Instagram Story + retained manual Story Drafts.
# One scheduled run at 15:30 HKT (07:30 UTC); no auto retry, backfill, or requeue.
# GitHub's schedule queue delay is intentionally allowed for by this time.
#
# Only complete cards are included: title, issue date, source, category, region,
# original attachment, deadline, audience, and fee. There is no local count cap;
# Instagram's own account/API limits still apply.
#
# Each image includes a QR straight to the source attachment and a category-aware Cantonese CTA.
# PNG + JPEG assets are force-pushed once to the `stories` branch. PNG keeps the
# notice-detail hero feature working; public JPEG URLs are fetched by Meta.
# Manual Run remains available and defaults to preview/draft-only (no IG post);
# scheduled runs publish. No images enter the main branch or Vercel deployment.
# ============================================================

name: Instagram Story + Drafts

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish to Instagram (default: update drafts only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Serialize scheduled and manual runs; both update the same stories branch.
  group: scout-circulars-story-assets
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      TZ: "Asia/Hong_Kong"
      PUBLISH_STORIES: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CJK font and image renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow 'qrcode[pil]'

      - name: Build today's complete queue (no count cap)
        id: queue
        run: |
          python3 story_queue.py --limit 0 --out "$RUNNER_TEMP/story-queue.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          q = json.loads(Path(os.environ["RUNNER_TEMP"], "story-queue.json").read_text(encoding="utf-8"))
          print(f"today={q['today']}")
          print(f"count={q['count']}")
          print(f"candidate_count={q['candidate_count']}")
          print(f"skipped_incomplete={q['skipped_incomplete']}")
          PY

      - name: Validate Instagram publishing configuration
        if: steps.queue.outputs.count != '0' && env.PUBLISH_STORIES == 'true'
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          if [ -z "$INSTAGRAM_USER_ID" ]; then
            echo "::error::Configure the INSTAGRAM_USER_ID GitHub Actions secret (numeric Instagram professional-account ID)."
            exit 1
          fi
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "::error::Configure the INSTAGRAM_ACCESS_TOKEN GitHub Actions secret. Do not paste tokens into workflow logs or chat."
            exit 1
          fi

      - name: Render every eligible Story as PNG and JPEG
        if: steps.queue.outputs.count != '0'
        run: |
          python3 tools/render_story_templates.py \
            --queue "$RUNNER_TEMP/story-queue.json" \
            --out "$RUNNER_TEMP/story-output" \
            --limit 0

      - name: Upload manual preview (does not publish)
        if: github.event_name == 'workflow_dispatch' && steps.queue.outputs.count != '0' && env.PUBLISH_STORIES != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: story-preview-${{ steps.queue.outputs.today }}
          path: ${{ runner.temp }}/story-output/${{ steps.queue.outputs.today }}/
          if-no-files-found: error
          retention-days: 3

      - name: Update public stories branch (also retained for manual drafts)
        if: steps.queue.outputs.count != '0'
        env:
          TODAY: ${{ steps.queue.outputs.today }}
        run: |
          set -euo pipefail
          cp tools/render_story_templates.py "$RUNNER_TEMP/build_story_index.py"
          cp .github/scripts/publish_instagram_stories.py "$RUNNER_TEMP/publish_instagram_stories.py"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin stories:stories-tmp 2>/dev/null; then
            git checkout -f stories-tmp
          else
            git checkout --orphan stories-tmp
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "stories/$TODAY"
          cp -R "$RUNNER_TEMP/story-output/$TODAY/." "stories/$TODAY/"
          # Keep the latest seven days for the notice-detail hero feature.
          mapfile -t old_days < <(find stories -mindepth 1 -maxdepth 1 -type d -name '20??-??-??' -printf '%f\n' | sort -r | tail -n +8)
          for day in "${old_days[@]}"; do rm -rf "stories/$day"; done
          python3 "$RUNNER_TEMP/build_story_index.py" --build-index stories
          git add stories/
          git commit -qm "📲 Instagram Story assets $TODAY [skip ci]"
          git push --force origin HEAD:stories

      - name: Publish every eligible Instagram Story (one attempt each)
        if: steps.queue.outputs.count != '0' && env.PUBLISH_STORIES == 'true'
        env:
          TODAY: ${{ steps.queue.outputs.today }}
          STORY_IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/stories/stories/${{ steps.queue.outputs.today }}/
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_GRAPH_API_BASE: ${{ vars.INSTAGRAM_GRAPH_API_BASE || 'https://graph.facebook.com' }}
          INSTAGRAM_GRAPH_API_VERSION: ${{ vars.INSTAGRAM_GRAPH_API_VERSION || 'v25.0' }}
        run: |
          python3 "$RUNNER_TEMP/publish_instagram_stories.py" \
            --manifest "stories/$TODAY/manifest.json" \
            --base-url "$STORY_IMAGE_BASE_URL"

      - name: Run summary
        if: always()
        run: |
          if [ -z "${{ steps.queue.outputs.count }}" ]; then
            echo "Queue step did not produce outputs; check the earlier failure log." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.queue.outputs.count }}" = "0" ]; then
            echo "No complete notices; no post, retry, backfill, or requeue." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Selected ${{ steps.queue.outputs.count }} complete notices out of ${{ steps.queue.outputs.candidate_count }} today; skipped incomplete: ${{ steps.queue.outputs.skipped_incomplete }}." >> "$GITHUB_STEP_SUMMARY"
            if [ "$PUBLISH_STORIES" = "true" ]; then
              echo "Scheduled/manual publish mode; each notice gets one API attempt. Failed posts are not retried." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Manual preview mode only; no image was published." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
