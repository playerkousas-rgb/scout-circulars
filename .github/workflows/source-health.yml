name: Scout Source Website Health

on:
  # Weekly, outside the daily scrape window. Run manually before/after source changes.
  schedule:
    - cron: "30 17 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-circulars-source-health
  cancel-in-progress: false

jobs:
  check-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      TZ: "Asia/Hong_Kong"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install health-check dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Check every enabled notice source
        run: python check_sources.py
      - name: Save per-source health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: health_report.json
          if-no-files-found: warn
          retention-days: 90
