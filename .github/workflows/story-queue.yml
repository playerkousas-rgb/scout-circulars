# ============================================================
# 手動 Story 清單工具（每日自動發佈由 story-draft.yml 負責）
#
# 只保留 workflow_dispatch，供管理員需要時手動刷新 story-queue.json。
# 正常每日流程不會先觸發本 workflow：12:00 HKT 的 story-draft.yml
# 會在同一個 run 內直接挑齊料通告、出圖並發佈，避免多一輪 Action。
# ============================================================

name: Story Queue

on:
  workflow_dispatch:

concurrency:
  group: scout-circulars-scrape-and-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      TZ: "Asia/Hong_Kong"
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load latest complete data snapshot
        run: python tools/data_snapshot.py load

      # 零 pip install：story_queue.py 係 stdlib only；各類先一張再補位，最多五張。
      - name: Build balanced Story queue (max five)
        run: python3 story_queue.py --limit 5

      - name: Publish latest-only data snapshot
        run: python tools/data_snapshot.py publish
