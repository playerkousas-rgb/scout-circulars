# ============================================================
# 手動 Story 清單工具（每日自動發佈由 story-draft.yml 負責）
#
# 只保留 workflow_dispatch，供管理員需要時手動刷新 story-queue.json。
# 正常每日流程不會先觸發本 workflow：15:30 HKT 的 story-draft.yml
# 會在同一個 run 內直接挑齊料通告、出圖並發佈，避免多一輪 Action。
# ============================================================

name: Story Queue

on:
  workflow_dispatch:

concurrency:
  group: scout-circulars-story-queue
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      TZ: "Asia/Hong_Kong"
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 零 pip install：story_queue.py 係 stdlib only；預設列出所有齊料通告。
      - name: Build complete Story queue
        run: python3 story_queue.py --limit 0

      - name: Commit story queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add story-queue.json
          git diff --cached --quiet || (git commit -m "📱 Update story queue [skip ci]" && git pull --rebase && git push)
