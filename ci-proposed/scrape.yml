# ============================================================
# 全港童軍通告自動化圖書館 v5.6 — GitHub Actions
# 流程：core.py（抓通告）→ enrich.py（增量抽 PDF 文字）→ 自動提交
#
# 每日排程架構（HKT）：
#   - 00:15 HKT（16:15 UTC）：本 workflow 執行全網抓取與增量抽取，更新 Git
#   - 03:00 HKT：本機工作排程執行補漏抓取
#   - 06:00 HKT（22:00 UTC）：notify.yml 統一發送 Web Push 推送通知
#
# 本 workflow 為純抓取與增量抽取，不執行 notify.py，不需要 VAPID / Supabase secrets。
# ⚠️ enrich 只跑「增量」模式（只抽新入庫 PDF），切勿使用 --all 以免觸發網站封鎖。
# ============================================================

name: Scout Notice Scraper

on:
  # 每日 00:15 HKT 自動執行抓取（16:15 UTC = 00:15 HKT）
  schedule:
    - cron: "15 16 * * *"

  # 手動觸發（隨時測試／補跑用）
  workflow_dispatch:

concurrency:
  group: scout-circulars-scrape-and-push
  cancel-in-progress: false

jobs:
  scrape-and-enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # 避免 runner 上的 urllib / requests 把中文路徑當 latin-1 處理
      PYTHONUTF8: "1"
      # 設定為香港時區（core.py / enrich.py 依賴 HKT 計算 captured_date）
      TZ: "Asia/Hong_Kong"
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # enrich.py 的 OCR fallback 需要 tesseract + poppler
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra poppler-utils
          pip install -r requirements.txt pdfplumber pdfminer.six pillow pytesseract pdf2image
          playwright install chromium

      # ── Step 1: 跑 core.py 抓通告 ──
      - name: Run core scraper
        run: |
          python core.py

      # ── Step 2: 跑 enrich.py 增量抽新入庫通告的文字 ──
      - name: Run enrich scraper (incremental only)
        run: |
          python enrich.py --verbose

      # ── Step 3: 健康檢查（報告記錄在 Action log）──
      - name: Health check (report only)
        run: |
          python check_stale.py || true

      # ── Step 4: 提交並推送更新 ──
      - name: Commit & push updated cache + enrich + fingerprints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache.json enrich.json fingerprints.json
          git diff --cached --quiet || (git commit -m "🤖 Auto-update circulars [skip ci]" && git push)
