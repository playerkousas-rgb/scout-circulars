<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全港童軍通告自動化圖書館 v5.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  .notice-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .notice-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px -6px rgba(0,0,0,0.4);
    border-color: #64748b;
  }

  .tab-item {
    transition: all 0.12s ease;
  }
  .tab-item.active {
    background: linear-gradient(135deg, #1e3a5f 0%, #1d4ed8 100%);
    box-shadow: 0 2px 8px rgba(59,130,246,0.25);
  }

  .region-header .chevron { transition: transform 0.2s ease; }
  .region-header.open .chevron { transform: rotate(90deg); }

  @keyframes pulse-dot { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }

  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, #1e293b 0%, #334155 50%, #1e293b 100%);
    background-size: 800px 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    border-radius: 8px;
  }

  .time-chip {
    transition: all 0.15s ease;
    cursor: pointer;
  }
  .time-chip.active {
    background: #1d4ed8;
    color: #fff;
    border-color: #3b82f6;
  }

  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.mobile-open { transform: translateX(0); }
  }
</style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex flex-col">

<!-- ===== TOP BAR ===== -->
<header class="bg-slate-950 border-b border-slate-700 px-4 py-3 flex items-center justify-between shrink-0 z-30">
  <div class="flex items-center gap-3">
    <button id="menuToggle" class="md:hidden text-slate-300 hover:text-white p-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <div class="flex items-center gap-2">
      <svg class="w-7 h-7 text-amber-500" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L3 7l3 2.5V17l6 3.5 6-3.5V9.5L21 7l-9-5zm0 2.4L18.6 7 12 10.4 5.4 7 12 4.4zM8 14.5V10l4 2.2 4-2.2v4.5L12 17l-4-2.5z"/>
      </svg>
      <div>
        <h1 class="text-lg font-bold text-white tracking-tight">童軍通告圖書館</h1>
        <p class="text-xs text-slate-400 -mt-0.5">Scout Notice Library v5.0</p>
      </div>
    </div>
  </div>
  <div class="flex items-center gap-3 text-sm">
    <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-600 inline-block"></span>
    <span id="statusText" class="text-slate-400 hidden sm:inline">就緒</span>
    <span class="text-slate-600 hidden sm:inline">|</span>
    <span id="updateTime" class="text-slate-500 text-xs hidden sm:inline">--</span>
  </div>
</header>

<!-- ===== MAIN LAYOUT ===== -->
<div class="flex flex-1 overflow-hidden relative">

  <!-- ===== SIDEBAR ===== -->
  <aside id="sidebar" class="sidebar w-72 bg-slate-950 border-r border-slate-700 flex flex-col shrink-0
         fixed md:relative z-20 h-[calc(100vh-57px)] transition-transform duration-300">
    <div class="p-3 border-b border-slate-800">
      <input type="text" id="districtSearch" placeholder="搜尋區會..."
        class="w-full bg-slate-800 text-slate-200 text-sm rounded-lg px-3 py-2
               border border-slate-700 focus:border-blue-500 focus:outline-none placeholder-slate-500">
    </div>
    <div class="px-3 py-2 border-b border-slate-800 text-xs text-slate-500 flex justify-between">
      <span id="sidebarTotal">-- 區會 · -- 則通告</span>
    </div>
    <nav id="regionNav" class="flex-1 overflow-y-auto px-2 py-2 space-y-1"></nav>
    <div class="p-3 border-t border-slate-800 text-xs text-slate-600 text-center">
      v5.0 · DOM指紋+PDF去重+30天沉底
    </div>
  </aside>

  <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-10 hidden md:hidden" onclick="closeSidebar()"></div>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="flex-1 overflow-y-auto p-4 md:p-6">

    <!-- Time window chips -->
    <div class="flex flex-wrap items-center gap-2 mb-5" id="timeChips">
      <span class="text-xs text-slate-500 mr-1">時間視窗:</span>
    </div>

    <!-- Stats bar -->
    <div id="statsBar" class="flex flex-wrap items-center gap-4 mb-5 text-sm text-slate-400"></div>

    <!-- Notice cards -->
    <div id="noticeGrid" class="grid gap-3"></div>

    <!-- Empty states -->
    <div id="emptyState" class="flex flex-col items-center justify-center py-24 text-slate-500 gap-3">
      <svg class="w-20 h-20 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
          d="M9 12h6m-3-3v6m-7 4h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
      <p class="text-lg">請從左側選單選擇區會，或等待資料載入</p>
      <p class="text-xs text-slate-600">30天沙盒沉底機制：預設僅顯示最近 30 天內捕獲的通告</p>
    </div>

    <div id="districtEmpty" class="hidden text-center py-16 text-slate-500">
      <p>此區會在當前時間視窗內暫無通告</p>
    </div>

    <!-- Loading -->
    <div id="loadingSkeleton" class="hidden space-y-3">
      <div class="skeleton h-8 w-48"></div>
      <div class="skeleton h-20 w-full"></div>
      <div class="skeleton h-20 w-full"></div>
      <div class="skeleton h-20 w-full"></div>
    </div>
  </main>
</div>

<!-- ===== SCRIPTS ===== -->
<script>
// ─── 配置 ──────────────────────────────────────────────
// 🔧 請替換為實際值
const SUPABASE_URL = 'YOUR_SUPABASE_URL';     // https://xxxx.supabase.co
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';    // public anon key

const GITHUB_RAW_CACHE = (
  'https://raw.githubusercontent.com/'
  + 'YOUR_USERNAME/YOUR_REPO/main/cache.json'
  + '?t=' + Date.now()
);

const USE_SUPABASE = SUPABASE_URL.startsWith('https://');

// ─── 時間視窗選項 ──────────────────────────────────────
const TIME_WINDOWS = [
  { label: '7天',  days: 7 },
  { label: '15天', days: 15 },
  { label: '30天', days: 30, default: true },
  { label: '3個月', days: 90 },
  { label: '6個月', days: 180 },
];

// ─── 地域/區會映射 ──────────────────────────────────────
const REGION_MAP = {
  '總會':        ['總會'],
  '港島地域':    ['港島地域','灣仔區','港島西區','柴灣區','維多利亞城區','港島南區','筲箕灣區','港島北區'],
  '九龍地域':    ['九龍地域','紅磡區','何文田區','九龍城區','九龍塘區','旺角區','深旺區','深水埗東區','深水埗西區','油尖區'],
  '東九龍地域':  ['東九龍地域','西貢區','慈雲山區_課程','慈雲山區_活動','黃大仙區','九龍灣區','秀茂坪區','將軍澳區','觀塘區','鯉魚門區'],
  '新界地域':    ['新界地域','元朗東區','元朗西區','十八鄉區','屯門西區','北葵涌區','屯門東區','荃灣區','南葵涌區','青衣區','離島區'],
  '新界東地域':  ['新界東地域','雙魚區','壁峰區','大埔北區','大埔南區','沙田西區','沙田南區','沙田東區','沙田北區'],
};

const REGION_EMOJI = {
  '總會': '🏛️', '港島地域': '🏝️', '九龍地域': '🏙️',
  '東九龍地域': '⛰️', '新界地域': '🌿', '新界東地域': '🏔️'
};

// ─── 全域狀態 ──────────────────────────────────────────
let allNotices = [];
let currentDistrict = null;
let currentDays = 30;
let openRegions = {};
let noticeCounts = {};

// ─── 初始化 ────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildTimeChips();
  buildSidebar();
  loadData();
  document.getElementById('districtSearch').addEventListener('input', e => buildSidebar(e.target.value));
});

// ─── 時間視窗 chips ────────────────────────────────────
function buildTimeChips() {
  const container = document.getElementById('timeChips');
  TIME_WINDOWS.forEach(tw => {
    const chip = document.createElement('button');
    chip.className = `time-chip px-3 py-1.5 rounded-full text-xs font-medium border
      ${tw.default ? 'active' : 'bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700'}`;
    chip.textContent = tw.label;
    chip.onclick = () => {
      currentDays = tw.days;
      document.querySelectorAll('.time-chip').forEach(c => {
        c.className = c.className.replace('active', '');
        c.classList.add('bg-slate-800','border-slate-600','text-slate-300','hover:bg-slate-700');
      });
      chip.classList.remove('bg-slate-800','border-slate-600','text-slate-300','hover:bg-slate-700');
      chip.classList.add('active');
      renderNotices();
    };
    container.appendChild(chip);
  });
}

// ─── 載入資料 ──────────────────────────────────────────
async function loadData() {
  showLoading(true);
  updateStatus('loading', '載入中...');

  try {
    if (USE_SUPABASE) {
      await loadFromSupabase();
    } else {
      await loadFromGitHub();
    }
    updateStatus('live', '線上');
  } catch (err) {
    console.error('載入失敗:', err);
    updateStatus('error', '離線');
    // 嘗試本地 fallback
    try {
      const r = await fetch('cache.json?' + Date.now(), { cache: 'no-store' });
      if (r.ok) {
        const data = await r.json();
        processNotices(data.notices || []);
        updateStatus('local', '本地');
      }
    } catch (_) {}
  }

  document.getElementById('updateTime').textContent =
    '通知: ' + allNotices.length + ' 則';
  buildSidebar(document.getElementById('districtSearch').value);
  renderNotices();
  showLoading(false);
}

async function loadFromSupabase() {
  const cutoff = daysAgo(currentDays);
  const url = `${SUPABASE_URL}/rest/v1/scout_notices?select=*&captured_date=gte.${cutoff}&order=captured_date.desc&limit=5000`;
  const resp = await fetch(url, {
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
  });
  if (!resp.ok) throw new Error(`Supabase HTTP ${resp.status}`);
  const notices = await resp.json();
  processNotices(notices);
}

async function loadFromGitHub() {
  const resp = await fetch(GITHUB_RAW_CACHE, { cache: 'no-store' });
  if (!resp.ok) throw new Error(`GitHub HTTP ${resp.status}`);
  const data = await resp.json();
  processNotices(data.notices || []);
}

function processNotices(notices) {
  allNotices = notices;
  // 計算各區會數量
  noticeCounts = {};
  for (const n of allNotices) {
    const site = n.source_site || '未知';
    noticeCounts[site] = (noticeCounts[site] || 0) + 1;
  }
}

// ─── 側邊欄建構 ────────────────────────────────────────
function buildSidebar(filter = '') {
  const nav = document.getElementById('regionNav');
  const filterLower = filter.toLowerCase().trim();
  let html = '';

  const totalDistricts = Object.values(REGION_MAP).flat().length;

  for (const [region, districts] of Object.entries(REGION_MAP)) {
    const filtered = filterLower
      ? districts.filter(d => d.toLowerCase().includes(filterLower) || region.includes(filterLower))
      : districts;
    if (filtered.length === 0 && filterLower) continue;

    const isOpen = openRegions[region] !== false;
    const emoji = REGION_EMOJI[region] || '📋';
    // Count total notices in this region (all time, for badge)
    let regionTotal = 0;
    for (const d of districts) {
      regionTotal += noticeCounts[d] || 0;
    }

    html += `<div class="region-group mb-1">`;
    html += `<button onclick="toggleRegion('${escA(region)}')"
      class="region-header ${isOpen ? 'open' : ''}
             w-full flex items-center gap-2 px-3 py-2.5 rounded-lg
             text-sm font-medium text-slate-300 hover:bg-slate-800/60
             transition-colors text-left">
      <svg class="chevron w-3.5 h-3.5 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
      </svg>
      <span>${emoji}</span><span class="truncate">${region}</span>
      <span class="ml-auto text-xs text-slate-600">${regionTotal || ''}</span>
    </button>`;

    html += `<div class="region-children ${isOpen ? '' : 'hidden'} ml-2 space-y-0.5 mt-0.5 mb-1">`;
    for (const district of filtered) {
      const count = noticeCounts[district] ?? '-';
      const isActive = currentDistrict === district;
      html += `<button onclick="selectDistrict('${escA(district)}')"
        class="tab-item w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm
               ${isActive ? 'active text-white' : 'text-slate-400 hover:bg-slate-800/40 hover:text-slate-200'}
               transition-all text-left">
        <span class="truncate flex-1">${district}</span>
        <span class="text-xs ${isActive ? 'text-blue-200' : 'text-slate-600'}"
              style="min-width:1.5rem;text-align:right">${count}</span>
      </button>`;
    }
    html += `</div></div>`;
  }

  nav.innerHTML = html || '<div class="text-center text-slate-600 py-8 text-sm">無匹配區會</div>';

  document.getElementById('sidebarTotal').textContent =
    `${totalDistricts} 區會 · ${allNotices.length} 則通告`;
}

function toggleRegion(region) {
  openRegions[region] = openRegions[region] === false;
  buildSidebar(document.getElementById('districtSearch').value);
}

function selectDistrict(name) {
  currentDistrict = name;
  closeSidebar();
  renderNotices();
  buildSidebar(document.getElementById('districtSearch').value);
}

// ─── 渲染通告卡片 ───────────────────────────────────────
function renderNotices() {
  // 🔥 30天沙盒沉底: 過濾 captured_date >= 今天 - currentDays
  const cutoff = daysAgo(currentDays);

  let filtered = allNotices.filter(n => {
    const d = n.captured_date || '';
    return d >= cutoff;
  });

  // 按區會過濾
  if (currentDistrict) {
    filtered = filtered.filter(n => (n.source_site || '') === currentDistrict);
  }

  // 按 captured_date 降序
  filtered.sort((a, b) => (b.captured_date || '').localeCompare(a.captured_date || ''));

  // Stats
  const uniqueSources = new Set(filtered.map(n => n.source_site)).size;
  document.getElementById('statsBar').innerHTML = `
    <span class="text-slate-300 font-semibold">${filtered.length} 則通告</span>
    <span class="text-slate-500">|</span>
    <span class="text-slate-500">${uniqueSources} 個來源</span>
    <span class="text-slate-500">|</span>
    <span class="text-slate-500">視窗: ${currentDays} 天</span>
    ${currentDistrict ? `<span class="text-slate-500">|</span><span class="text-blue-400">🏷️ ${currentDistrict}</span>` : ''}
  `;

  // Grid
  const grid = document.getElementById('noticeGrid');
  const empty = document.getElementById('emptyState');
  const distEmpty = document.getElementById('districtEmpty');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    if (currentDistrict) {
      distEmpty.classList.remove('hidden');
      empty.classList.add('hidden');
    } else {
      distEmpty.classList.add('hidden');
      empty.classList.remove('hidden');
    }
    return;
  }

  empty.classList.add('hidden');
  distEmpty.classList.add('hidden');

  let html = '';
  for (const n of filtered) {
    const dateDisplay = formatDate(n.captured_date || '');
    const siteLabel = n.source_site || '';

    html += `
      <a href="${escA(n.pdf_url || '#')}" target="_blank" rel="noopener"
         class="notice-card block bg-slate-800/50 border border-slate-700/60 rounded-xl p-4
                hover:border-slate-500 transition-colors group">
        <div class="flex items-start justify-between gap-3">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs px-2 py-0.5 rounded-full bg-slate-700 text-slate-400">${escH(siteLabel)}</span>
            </div>
            <h3 class="text-slate-100 font-medium leading-snug group-hover:text-white transition-colors">
              ${escH(n.title || '(無標題)')}
            </h3>
          </div>
          <span class="shrink-0 text-xs px-2.5 py-1 rounded-full border bg-blue-900/60 text-blue-200 border-blue-500/30 whitespace-nowrap">
            📅 ${dateDisplay}
          </span>
        </div>
      </a>`;
  }

  grid.innerHTML = html;
}

// ─── 輔助函式 ──────────────────────────────────────────
function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().split('T')[0];
}

function formatDate(str) {
  if (!str) return '--';
  const parts = str.split('-');
  if (parts.length === 3) {
    return `${parseInt(parts[1])}月${parseInt(parts[2])}日`;
  }
  return str;
}

function escH(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function escA(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateStatus(state, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'w-2 h-2 rounded-full inline-block';
  if (state === 'live') dot.classList.add('bg-green-500','pulse-dot');
  else if (state === 'loading') dot.classList.add('bg-yellow-500','pulse-dot');
  else if (state === 'error') dot.classList.add('bg-red-500');
  else if (state === 'local') dot.classList.add('bg-yellow-500');
  else dot.classList.add('bg-slate-600');
  txt.textContent = text;
}

function showLoading(show) {
  document.getElementById('loadingSkeleton').classList.toggle('hidden', !show);
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebarOverlay').classList.add('hidden');
}

document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sidebarOverlay').classList.toggle('hidden');
});
</script>
</body>
</html>
