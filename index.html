<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>通告圖書館 v5.6</title>
  <style>
    :root {
      --bg: #02133e;
      --panel: #0f1728;
      --panel-2: #111d32;
      --line: #243553;
      --text: #e6eefb;
      --muted: #8ea2c6;
      --brand: #3b82f6;
      --brand-2: #11284f;
      --good: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 18px 40px rgba(0,0,0,.28);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .app { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
    .sidebar { border-right: 1px solid var(--line); background: var(--bg); padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
    .brand { padding: 8px 10px 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
    .brand h1 { margin: 0; font-size: 20px; line-height: 1.35; }
    .brand p { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
    .panel { background: linear-gradient(180deg, rgba(17,29,50,.95), rgba(11,20,36,.95)); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .meta { padding: 12px; margin-bottom: 12px; }
    .meta .big { font-size: 15px; font-weight: 700; }
    .meta .sub { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .meta-cell { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; }
    .meta-cell strong { display: block; font-size: 15px; margin-bottom: 4px; }
    .meta-cell span { color: var(--muted); font-size: 11px; }
    .sidebar input[type="search"] { width: 100%; border: 1px solid var(--line); background: #0b1424; color: var(--text); border-radius: 12px; padding: 11px 12px; margin-bottom: 12px; outline: none; }
    .accordion { display: grid; gap: 10px; }
    .region { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,.02); }
    .region > button { width: 100%; border: 0; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; background: transparent; color: var(--text); cursor: pointer; }
    .region > button:hover { background: rgba(255,255,255,.03); }
    .region.open > button { background: var(--brand-2); color: #d9e8ff; }
    /* 有通告(count>0)的地域：整列高亮底色 + 左側綠邊 */
    .region.has-updates { border-color: #22c55e; background: rgba(34,197,94,.18); box-shadow: 0 0 0 1px rgba(34,197,94,.35); }
    .region.has-updates > button { background: rgba(34,197,94,.22); color: #d7ffe6; font-weight: 700; }
    .region.has-updates.open > button { background: var(--brand-2); }
    .source-list { display: none; padding: 8px; gap: 8px; }
    .region.open .source-list { display: grid; }
    .source-btn { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #0b1424; color: var(--text); text-align: left; cursor: pointer; position: relative; }
    .source-btn:hover { background: #10203a; }
    .source-btn.active { background: linear-gradient(135deg, #173664, #2450a3); border-color: #4d82e7; }
    .source-btn small { display: block; margin-top: 4px; color: var(--muted); }
    /* 有通告的區會：整列綠底 + 粗左綠邊 */
    .source-btn.has-updates { background: rgba(34,197,94,.20); border-color: #22c55e; border-left: 5px solid #22c55e; color: #eafff2; font-weight: 600; }
    .source-btn.has-updates small { color: #7bedab; }
    .source-btn.has-updates:hover { background: rgba(34,197,94,.30); }
    .source-btn.has-updates.active { background: linear-gradient(135deg, #15643a, #1f9e5c); border-left: 5px solid #6effa0; }
    /* 彩色數字 badge */
    .count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 13px; font-weight: 800; background: rgba(255,255,255,.08); color: var(--muted); }
    .count-badge.hot { background: #22c55e; color: #04210f; box-shadow: 0 0 12px rgba(34,197,94,.7), 0 0 0 3px rgba(34,197,94,.25); }
    .content { padding: 24px; }
    .hero { padding: 18px; }
    .hero h2 { margin: 0 0 8px; font-size: 28px; line-height: 1.25; }
    .hero .sub { color: var(--muted); font-size: 14px; }
    /* 區會聯絡 icon bar */
    .contact-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
    .contact-ico { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #0b1424; color: #cdd9ec; text-decoration: none; transition: .15s; }
    .contact-ico:hover { background: #16263f; border-color: #3a5a8c; transform: translateY(-2px); }
    .contact-ico svg { width: 20px; height: 20px; flex: 0 0 20px; }
    .contact-ico.fb { border-color: rgba(24,119,242,.5); }
    .contact-ico.fb:hover { background: rgba(24,119,242,.18); }
    .contact-ico.ig { border-color: rgba(214,41,118,.5); }
    .contact-ico.ig:hover { background: rgba(214,41,118,.18); }
    .contact-ico.map { border-color: rgba(34,197,94,.5); }
    .contact-ico.map:hover { background: rgba(34,197,94,.18); }
    .contact-ico.yt { border-color: rgba(255,0,0,.5); }
    .contact-ico.yt:hover { background: rgba(255,0,0,.16); }
    .contact-ico.email { border-color: rgba(234,179,8,.5); }
    .contact-ico.email:hover { background: rgba(234,179,8,.16); }
    .contact-ico.tel { cursor: default; }
    .controls { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .controls input[type="search"] { flex: 1; min-width: 240px; border: 1px solid var(--line); background: #09111f; color: var(--text); border-radius: 12px; padding: 12px 14px; outline: none; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #0b1424; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--line); background: #0b1424; color: var(--muted); border-radius: 999px; padding: 9px 13px; cursor: pointer; }
    .chip.active { background: linear-gradient(135deg, #2153ad, #1b82f8); color: #fff; border-color: #4d82e7; }
    .scope-chips { display: flex; gap: 8px; }
    .scope-chip { border: 1px solid var(--line); background: #0b1424; color: var(--muted); border-radius: 12px; padding: 10px 14px; cursor: pointer; font-size: 13px; }
    .scope-chip.active { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; border-color: #c084fc; }
    .field-label { color: var(--muted); font-size: 13px; align-self: center; }
    .field-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .status { margin-top: 12px; color: var(--muted); font-size: 13px; }
    .msg { margin-top: 18px; padding: 18px; border-radius: var(--radius); border: 1px solid var(--line); background: rgba(255,255,255,.03); }
    .msg.error { border-color: rgba(239,68,68,.4); color: #ffd6d6; background: rgba(127,29,29,.18); }
    .cards { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    .card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--radius); border: 1px solid var(--line); background: linear-gradient(180deg, rgba(15,23,40,.92), rgba(8,14,26,.95)); box-shadow: var(--shadow); }
    .badge { display: inline-flex; align-items: center; gap: 6px; width: fit-content; font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(59,130,246,.35); background: rgba(29,78,216,.18); color: #b6d4ff; }
    .card h3 { margin: 0; font-size: 18px; line-height: 1.45; }
    /* enrich 補充資料（截止/對象/費用）*/
    .ex-box { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: rgba(34,197,94,.07); border: 1px solid rgba(34,197,94,.22); }
    .ex-row { display: flex; align-items: flex-start; gap: 7px; font-size: 13px; color: #d7e6f5; line-height: 1.4; }
    .ex-ico { flex: 0 0 auto; font-size: 13px; }
    .ex-row .ex-deadline { color: #f87171; }
    .meta-row { display: flex; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; margin-top: auto; }
    .meta-row .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta-row .link { color: #cfe3ff; }
    code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 8px; }
    .ss-connect { margin-top: 12px; padding: 12px; border-radius: 14px; border: 1px solid rgba(59,130,246,.35); background: rgba(59,130,246,.08); display: grid; gap: 8px; }
    .ss-connect-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .ss-connect input { flex: 1; min-width: 260px; border: 1px solid var(--line); background: #09111f; color: var(--text); border-radius: 12px; padding: 10px 12px; outline: none; }
    .ss-save, .ss-import { border: 1px solid rgba(59,130,246,.45); background: #173664; color: #d9e8ff; border-radius: 12px; padding: 9px 12px; cursor: pointer; font-weight: 700; }
    .ss-save:hover, .ss-import:hover { background: #2450a3; }
    .ss-import { width: 100%; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .content { padding: 16px; }
      .hero h2 { font-size: 22px; }
    }
  </style>
</head>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
  <h1>通告圖書館 v5.6</h1>
  <p>每天自動更新<br>擇要未必完全準確，詳情請開附件參閱詳細通告。</p>
  <p style="margin-top:10px;"><a href="errors.html" style="color:#93c5fd;font-size:12px;">→ 診斷儀表板</a></p>
</div>

      <div class="panel meta" id="sidebar-meta">
        <div class="big">讀取中…</div>
        <div class="sub">等待 GitHub Raw cache.json</div>
      </div>

      <input id="district-search" type="search" placeholder="搜尋地域 / 區會…">
      <div class="accordion" id="accordion"></div>
    </aside>

    <main class="content">
      <section class="panel hero">
        <h2 id="page-title">載入中…</h2>
        <div class="sub" id="page-subtitle">目前支援分區或全港層級瀏覽。</div>

        <div class="contact-bar" id="contact-bar"></div>

        <div class="controls">
          <input id="keyword" type="search" placeholder="搜尋名稱 / 成員 / 支部…">
          <div class="scope-chips" id="scope-chips">
            <button class="scope-chip active" data-scope="current">目前分頁</button>
            <button class="scope-chip" data-scope="global">全港搜尋</button>
          </div>
        </div>

        <div class="controls">
          <span class="field-label">搜尋範圍：</span>
          <div class="field-chips" id="field-chips">
            <button class="chip active" data-field="name">名稱</button>
            <button class="chip active" data-field="member">成員</button>
            <button class="chip active" data-field="branch">支部</button>
          </div>
          <label class="toggle"><input id="explicit-date" type="checkbox"> 只顯示明確日期</label>
        </div>

        <div class="controls">
          <div class="chips" id="window-chips"></div>
        </div>

        <div class="status" id="status-line"></div>
        <div class="ss-connect">
          <div class="ss-connect-row"><strong>ScoutSystem 接入</strong><span class="sub">設定一次後，每張通告可直接加入你的旅團系統。</span></div>
          <div class="ss-connect-row">
            <input id="scoutsystem-url" placeholder="例如：https://scoutsystem.vercel.app">
            <button class="ss-save" id="save-scoutsystem-url">儲存 ScoutSystem 網址</button>
          </div>
          <div class="status" id="scoutsystem-status"></div>
        </div>
      </section>

      <section id="messages"></section>
      <section class="cards" id="cards"></section>
      <footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 13px;">
        <div id="visit-counter" style="margin-bottom: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid var(--line);">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#7bb0ff" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="visit-count">累計瀏覽 …</span>
        </div>
        <div>Copyright &copy; 2026 SCOUT SYSTEM</div>
      </footer>
    </main>
  </div>

    function getRawUrl() {
      const params = new URLSearchParams(location.search);
      const raw = params.get('raw') || RAW_CACHE_URL;
      return `${raw}${raw.includes('?') ? '&' : '?'}t=${Date.now()}`;
    }

    function getEnrichUrl() {
      const params = new URLSearchParams(location.search);
      // 若用 ?raw= 覆蓋 cache，enrich 自動取同目錄的 enrich.json；否則用預設
      let base = params.get('enrich');
      if (!base) {
        const rawCache = params.get('raw');
        base = rawCache ? rawCache.replace(/cache\.json.*$/, 'enrich.json') : RAW_ENRICH_URL;
      }
      return `${base}${base.includes('?') ? '&' : '?'}t=${Date.now()}`;
    }

    // 載入 enrich.json（失敗都唔影響主畫面）
    async function loadEnrich() {
      try {
        const r = await fetch(getEnrichUrl(), { cache: 'no-store' });
        if (r.ok) state.enrich = await r.json();
      } catch (_) { state.enrich = {}; }
    }

    function parseDate(value) {
      if (!value) return null;
      const m = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
      const year = Number(m[1]);
      if (year < 2024 || year > 2028) return null;
      const d = new Date(`${m[1]}-${m[2]}-${m[3]}T00:00:00+08:00`);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function formatDate(value) {
      const d = parseDate(value);
      if (!d) return '日期不明';
      return `${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function getScoutSystemUrl() {
      return (localStorage.getItem('scoutsystem_import_base_url') || '').replace(/\/$/, '');
    }

      return item.pdf_url || item.url || `${item.source_site || ''}|${item.title || ''}|${item.captured_date || item.date || ''}`;
    }

    function buildScoutSystemImportUrl(item, ex) {
      const base = getScoutSystemUrl();
      if (!base) return '';
      const href = item.url || item.pdf_url || '';
      const params = new URLSearchParams();
      params.set('title', item.title || '');
      params.set('sourceSite', item.source_site || state.activeSource || '');
      params.set('region', item.region || '');
      params.set('date', item.date || item.captured_date || '');
      params.set('sourceUrl', href);
      params.set('attachmentUrl', item.pdf_url || href);
      params.set('pdf_url', item.pdf_url || href);
      params.set('key', makeCircularKey(item));
      if (ex?.deadline) params.set('deadline', ex.deadline);
      if (ex?.audience) params.set('audience', ex.audience);
      if (ex?.fee) params.set('fee', ex.fee);
      return `${base}/library/import?${params.toString()}`;
    }

    function buildGroupedFromFlat(notices) {
      const grouped = {};
      for (const item of notices || []) {
        const source = item.source_site || '未分類';
        grouped[source] ||= [];
        grouped[source].push({
          title: item.title || '',
          url: item.pdf_url || item.url || '',
          pdf_url: item.pdf_url || item.url || '',
          date: item.captured_date || item.date || '',
          captured_date: item.captured_date || item.date || '',
          source_site: source,
          region: item.region || '',
        });
      }
      return grouped;
    }

    function deriveRegions(grouped, metaRegions) {
      if (metaRegions && Object.keys(metaRegions).length) return metaRegions;
      const regions = {};
      for (const [source, arr] of Object.entries(grouped)) {
        const region = arr[0]?.region || '未分類';
        regions[region] ||= [];
        regions[region].push(source);
      }
      return regions;
    }

    function badgeHtml(n) {
      return `<span class="count-badge ${n > 0 ? 'hot' : ''}">${n}</span>`;
    }

    function sourceCount(source) {
      const items = state.grouped[source] || [];
      return items.filter(item => {
        const dateValue = item.date || item.captured_date || '';
        return inWindow(dateValue);
      }).length;
    }

    function getBucket(sourceId) {
      if (sourceId === 'ALL_SOURCES') {
        let all = [];
        for (const src of state.sourceOrder) {
          all = all.concat(state.grouped[src] || []);
        }
        return all;
      }
      if (sourceId && sourceId.startsWith('REGION:')) {
        const regionName = sourceId.substring(7);
        const sourcesInRegion = state.regions[regionName] || [];
        let all = [];
        for (const src of sourcesInRegion) {
          all = all.concat(state.grouped[src] || []);
        }
        return all;
      }
      return state.grouped[sourceId] || [];
    }

    function getSourceTitle(sourceId) {
      if (sourceId === 'ALL_SOURCES') return '全港 (所有層級)';
      if (sourceId && sourceId.startsWith('REGION:')) return sourceId.substring(7) + ' (全部)';
      return sourceId || '未選擇來源';
    }

    function currentWindow() {
      return TIME_WINDOWS.find(x => x.id === state.windowId) || TIME_WINDOWS[2];
    }

    function inWindow(itemDate) {
      const win = currentWindow();
      if (win.days == null) return true;
      const d = parseDate(itemDate);
      if (!d) return false;
      const now = new Date();
      const diff = now.getTime() - d.getTime();
      return diff <= win.days * 24 * 60 * 60 * 1000;
    }

    function getCurrentItems() {
      let items;
      if (state.searchScope === 'global') {
        items = [];
        for (const src of state.sourceOrder) {
          items = items.concat(state.grouped[src] || []);
        }
      } else {
        items = [...getBucket(state.activeSource)];
      }

      items = items.filter(item => {
        const dateValue = item.date || item.captured_date || '';
        if (state.explicitDateOnly && !parseDate(dateValue)) return false;
        if (!inWindow(dateValue)) return false;
        if (state.keyword) {
          const q = state.keyword.toLowerCase();
          const ex = state.enrich[item.pdf_url] || state.enrich[item.url] || null;
          const checks = [];
          if (state.searchFields.name) {
            checks.push(String(item.title || '').toLowerCase().includes(q));
          }
          if (state.searchFields.member && ex?.audience) {
            checks.push(ex.audience.toLowerCase().includes(q));
          }
          if (state.searchFields.branch) {
            checks.push(String(item.source_site || '').toLowerCase().includes(q));
            checks.push(String(item.region || '').toLowerCase().includes(q));
          }
          return checks.some(Boolean);
        }
        return true;
      });

      items.sort((a, b) => {
        const da = parseDate(a.date || a.captured_date)?.getTime() ?? -Infinity;
        const db = parseDate(b.date || b.captured_date)?.getTime() ?? -Infinity;
        if (db !== da) return db - da;
        return String(a.title || '').localeCompare(String(b.title || ''), 'zh-Hant');
      });

      return items;
    }

    function renderWindowChips() {
      const wrap = $('#window-chips');
      wrap.innerHTML = '';
      for (const win of TIME_WINDOWS) {
        const btn = document.createElement('button');
        btn.className = `chip ${state.windowId === win.id ? 'active' : ''}`;
        btn.textContent = win.label;
        btn.onclick = () => {
          state.windowId = win.id;
          renderWindowChips();
          renderAccordion();
          renderSidebarMeta();
          renderHeader();
          renderCards();
        };
        wrap.appendChild(btn);
      }
    }

    function renderScopeChips() {
      const wrap = $('#scope-chips');
      wrap.innerHTML = '';
      const scopes = [
        { id: 'current', label: '目前分頁' },
        { id: 'global', label: '全港搜尋' },
      ];
      for (const sc of scopes) {
        const btn = document.createElement('button');
        btn.className = `scope-chip ${state.searchScope === sc.id ? 'active' : ''}`;
        btn.textContent = sc.label;
        btn.dataset.scope = sc.id;
        btn.onclick = () => {
          state.searchScope = sc.id;
          renderScopeChips();
          renderHeader();
          renderCards();
        };
        wrap.appendChild(btn);
      }
    }

    function renderFieldChips() {
      const wrap = $('#field-chips');
      wrap.innerHTML = '';
      const fields = [
        { id: 'name', label: '名稱' },
        { id: 'member', label: '成員' },
        { id: 'branch', label: '支部' },
      ];
      for (const f of fields) {
        const btn = document.createElement('button');
        btn.className = `chip ${state.searchFields[f.id] ? 'active' : ''}`;
        btn.textContent = f.label;
        btn.dataset.field = f.id;
        btn.onclick = () => {
          state.searchFields[f.id] = !state.searchFields[f.id];
          // 至少保留一個，避免全關導致永遠沒結果
          if (!Object.values(state.searchFields).some(Boolean)) {
            state.searchFields[f.id] = true;
          }
          renderFieldChips();
          renderHeader();
          renderCards();
        };
        wrap.appendChild(btn);
      }
    }

    function renderSidebarMeta() {
      const totalSources = state.sourceOrder.length;
      const totalNotices = state.sourceOrder.reduce((sum, source) => sum + sourceCount(source), 0);
      const nonEmptySources = state.sourceOrder.filter(source => sourceCount(source) > 0).length;
      
      let isTodayError = false;
      const lastUpdateStr = state.cache?.last_updated;
      const hasErrors = state.cache?._meta?.has_errors === true;
      
      if (hasErrors && lastUpdateStr) {
        const updateDate = lastUpdateStr.substring(0, 10);
        const hkTime = new Date(new Date().getTime() + (8 * 60 * 60 * 1000));
        const todayHK = hkTime.toISOString().substring(0, 10);
        if (updateDate === todayHK) {
          isTodayError = true;
        }
      }
      
      const errorStyle = isTodayError ? 'color: var(--warn);' : '';
      
      $('#sidebar-meta').innerHTML = `
        <div class="big" style="${errorStyle}">最後更新：${escapeHtml(state.cache?.last_updated || '未有資料')}</div>
        <div class="sub">支援分區或全港層級瀏覽</div>
        <div class="meta-grid">
          <div class="meta-cell"><strong>${totalSources}</strong><span>來源</span></div>
          <div class="meta-cell"><strong>${nonEmptySources}</strong><span>有資料</span></div>
          <div class="meta-cell"><strong>${totalNotices}</strong><span>資產</span></div>
        </div>
      `;
    }

    function renderAccordion() {
      const q = state.searchRegionKeyword.toLowerCase().trim();
      accordionEl.innerHTML = '';

      // All Levels Pseudo-Region
      if (!q || '全港 (所有層級)'.includes(q)) {
        const allEl = document.createElement('section');
        allEl.className = 'region';
        const totalAll = state.sourceOrder.reduce((sum, src) => sum + sourceCount(src), 0);
        
        const allBtn = document.createElement('button');
        allBtn.innerHTML = `<span>全港 (所有層級)</span>${badgeHtml(totalAll)}`;
        if (totalAll > 0) allEl.classList.add('has-updates');
        if (state.activeSource === 'ALL_SOURCES') allEl.classList.add('open');
        allBtn.onclick = () => {
          state.activeSource = 'ALL_SOURCES';
          renderAccordion();
          renderHeader();
          renderCards();
        };
        allEl.appendChild(allBtn);
        accordionEl.appendChild(allEl);
      }

      const regions = Object.entries(state.regions);
      for (const [regionName, sources] of regions) {
        const filteredSources = q
          ? sources.filter(src => src.toLowerCase().includes(q) || regionName.toLowerCase().includes(q))
          : sources;
        if (!filteredSources.length) continue;

        const regionEl = document.createElement('section');
        regionEl.className = 'region';
        const isRegionActive = state.activeSource === 'REGION:' + regionName;
        const shouldOpen = isRegionActive || filteredSources.includes(state.activeSource);
        if (shouldOpen) regionEl.classList.add('open');

        const total = filteredSources.reduce((sum, src) => sum + sourceCount(src), 0);
        if (total > 0) regionEl.classList.add('has-updates');
        const header = document.createElement('button');
        header.innerHTML = `<span>${escapeHtml(regionName)}</span>${badgeHtml(total)}`;
        header.onclick = () => regionEl.classList.toggle('open');
        regionEl.appendChild(header);

        const list = document.createElement('div');
        list.className = 'source-list';
        
        // Add "All in this Region" button
        if (filteredSources.length > 1 || true) {
          const allRegionBtn = document.createElement('button');
          allRegionBtn.className = `source-btn ${isRegionActive ? 'active' : ''} ${total > 0 ? 'has-updates' : ''}`;
          allRegionBtn.innerHTML = `<span>全部 (${escapeHtml(regionName)})</span><small>${total} 則</small>`;
          allRegionBtn.onclick = () => {
            state.activeSource = 'REGION:' + regionName;
            renderAccordion();
            renderHeader();
            renderCards();
          };
          list.appendChild(allRegionBtn);
        }

        for (const source of filteredSources) {
          const cnt = sourceCount(source);
          const btn = document.createElement('button');
          btn.className = `source-btn ${state.activeSource === source ? 'active' : ''} ${cnt > 0 ? 'has-updates' : ''}`;
          btn.innerHTML = `<span>${escapeHtml(source)}</span><small>${cnt} 則</small>`;
          btn.onclick = () => {
            state.activeSource = source;
            renderAccordion();
            renderHeader();
            renderCards();
          };
          list.appendChild(btn);
        }
        regionEl.appendChild(list);
        accordionEl.appendChild(regionEl);
      }

      if (!accordionEl.children.length) {
        accordionEl.innerHTML = '<div class="msg">找不到相符地域 / 區會。</div>';
      }
    }

    function renderContactBar() {
      const bar = $('#contact-bar');
      if (!bar) return;
      const src = state.activeSource;
      // 全港搜尋模式或揀全港 / 整個地域時不顯示單一區會聯絡
      if (state.searchScope === 'global' || !src || src === 'ALL_SOURCES' || src.startsWith('REGION:')) { bar.innerHTML = ''; return; }
      const c = (typeof CONTACTS !== 'undefined' && CONTACTS[src]) || null;
      if (!c) { bar.innerHTML = ''; return; }
      const items = [];
      if (c.fb)  items.push(`<a class="contact-ico fb" href="${c.fb}" target="_blank" rel="noopener" title="Facebook">${SVG.fb}</a>`);
      if (c.ig)  items.push(`<a class="contact-ico ig" href="${c.ig}" target="_blank" rel="noopener" title="Instagram">${SVG.ig}</a>`);
      if (c.yt)  items.push(`<a class="contact-ico yt" href="${c.yt}" target="_blank" rel="noopener" title="YouTube">${SVG.yt}</a>`);
      if (c.web) items.push(`<a class="contact-ico web" href="${c.web}" target="_blank" rel="noopener" title="官網">${SVG.web}</a>`);
      if (c.map) items.push(`<a class="contact-ico map" href="${c.map}" target="_blank" rel="noopener" title="${escapeHtml(c.address||'地址')}">${SVG.map}</a>`);
      if (c.tel) items.push(`<a class="contact-ico tel" href="tel:${c.tel.replace(/\s/g,'')}" title="電話：${escapeHtml(c.tel)}">${SVG.tel}</a>`);
      if (c.email) items.push(`<a class="contact-ico email" href="mailto:${c.email}" title="電郵：${escapeHtml(c.email)}">${SVG.email}</a>`);
      bar.innerHTML = items.join('');
    }

    function renderHeader() {
      renderContactBar();
      const current = getCurrentItems().length;
      $('#page-title').textContent = state.searchScope === 'global' ? '全港搜尋' : getSourceTitle(state.activeSource);

      let subtitle = '請先選擇一個來源。';
      if (state.activeSource === 'ALL_SOURCES') subtitle = '目前顯示全港所有通告。';
      else if (state.activeSource && state.activeSource.startsWith('REGION:')) subtitle = `目前顯示 ${getSourceTitle(state.activeSource)} 所有區會的通告。`;
      else if (state.activeSource) subtitle = '';

      if (state.searchScope === 'global') {
        subtitle = `全港搜尋「${escapeHtml(state.keyword || '(未輸入)')}」— 忽略左邊分頁選擇。`;
      }

      const subEl = $('#page-subtitle');
      subEl.textContent = subtitle;
      subEl.style.display = subtitle ? '' : 'none';

      const scopeLabel = state.searchScope === 'global' ? '全港' : '目前分頁';
      const totalAll = state.sourceOrder.reduce((sum, src) => sum + (state.grouped[src] || []).length, 0);
      const totalCurrent = state.searchScope === 'global' ? totalAll : getBucket(state.activeSource).length;
      $('#status-line').innerHTML = `
        模式：<code>${scopeLabel}</code>
        ・視窗：<code>${escapeHtml(currentWindow().label)}</code>
        ・顯示：<code>${current}</code>
        ・本來源總數：<code>${totalCurrent}</code>
        ・cache：<code>${escapeHtml(state.cache?.meta?.version || state.cache?._meta?.version || 'unknown')}</code>
      `;
    }

    function renderCards() {
      messagesEl.innerHTML = '';
      cardsEl.innerHTML = '';

      if (!state.activeSource) {
        messagesEl.innerHTML = '<div class="msg">請先從左邊揀選一個地域 / 區會分頁。</div>';
        return;
      }

      const items = getCurrentItems();
      if (!items.length) {
        messagesEl.innerHTML = '<div class="msg">這個來源在目前時間視窗 / 搜尋條件下暫時沒有資料。</div>';
        return;
      }

      for (const item of items) {
        const href = item.url || item.pdf_url || '#';
        let host = '';
        try { host = new URL(href).hostname; } catch (_) {}

        // 查 enrich 補充資料（截止 / 對象 / 費用）
        const ex = state.enrich[item.pdf_url] || state.enrich[item.url] || null;
        let extraHtml = '';
        if (ex) {
          const rows = [];
          if (ex.deadline) rows.push(`<div class="ex-row"><span class="ex-ico ex-deadline">⏳</span>截止：${escapeHtml(ex.deadline)}</div>`);
          if (ex.audience) rows.push(`<div class="ex-row"><span class="ex-ico ex-aud">👤</span>對象：${escapeHtml(ex.audience)}</div>`);
          if (ex.fee)      rows.push(`<div class="ex-row"><span class="ex-ico ex-fee">💲</span>費用：${escapeHtml(ex.fee)}</div>`);
          if (rows.length) extraHtml = `<div class="ex-box">${rows.join('')}</div>`;
        }

        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="badge">${escapeHtml(item.source_site || state.activeSource || '')}</div>
          <h3>${escapeHtml(item.title || '未命名通告')}</h3>
          <div class="meta-row">
            <span>${escapeHtml(formatDate(item.date || item.captured_date || ''))}</span>
            <span class="host">${escapeHtml(host)}</span>
          </div>
          ${extraHtml}
          <div class="meta-row">
            <span>${escapeHtml(item.region || '')}</span>
            <a class="link" href="${encodeURI(href)}" target="_blank" rel="noopener noreferrer">開啟附件</a>
          </div>
          <button class="ss-import" data-ss-url="${escapeHtml(buildScoutSystemImportUrl(item, ex))}">加入 ScoutSystem</button>
        `;
        const ssBtn = card.querySelector('.ss-import');
        if (ssBtn) {
          ssBtn.onclick = () => {
            const target = ssBtn.getAttribute('data-ss-url') || '';
            if (!getScoutSystemUrl()) {
              alert('請先在上方設定你的 ScoutSystem 網址，例如 https://scoutsystem.vercel.app');
              document.getElementById('scoutsystem-url')?.focus();
              return;
            }
            if (target) window.open(target, '_blank');
          };
        }
        cardsEl.appendChild(card);
      }
    }

    function pickDefaultSource() {
      const firstNonEmpty = state.sourceOrder.find(source => sourceCount(source) > 0);
      state.activeSource = 'ALL_SOURCES';
    }

    async function loadCache() {
      messagesEl.innerHTML = '<div class="msg">正在從 GitHub Raw CDN 讀取最新 cache.json…</div>';
      try {
        const resp = await fetch(getRawUrl(), { cache: 'no-store' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        state.cache = await resp.json();

        await loadEnrich();  // 載入截止/對象/費用補充資料

        state.grouped = state.cache.data && Object.keys(state.cache.data).length
          ? state.cache.data
          : buildGroupedFromFlat(state.cache.notices || []);

        state.regions = deriveRegions(state.grouped, state.cache?._meta?.regions || {});
        state.sourceOrder = state.cache?._meta?.source_order?.length
          ? state.cache._meta.source_order
          : Object.keys(state.grouped);

        for (const source of Object.keys(state.grouped)) {
          if (!state.sourceOrder.includes(source)) state.sourceOrder.push(source);
        }

        pickDefaultSource();
        renderSidebarMeta();
        renderAccordion();
        renderWindowChips();
        renderHeader();
        renderCards();
      } catch (err) {
        messagesEl.innerHTML = `<div class="msg error">讀取 GitHub Raw cache.json 失敗：${escapeHtml(err.message || String(err))}</div>`;
      }
    }

    $('#keyword').addEventListener('input', (e) => {
      state.keyword = e.target.value.trim();
      renderHeader();
      renderCards();
    });

    $('#explicit-date').addEventListener('change', (e) => {
      state.explicitDateOnly = e.target.checked;
      renderHeader();
      renderCards();
    });

    $('#district-search').addEventListener('input', (e) => {
      state.searchRegionKeyword = e.target.value || '';
      renderAccordion();
    });

    function initScoutSystemConnect() {
      const input = document.getElementById('scoutsystem-url');
      const btn = document.getElementById('save-scoutsystem-url');
      const status = document.getElementById('scoutsystem-status');
      if (!input || !btn) return;
      input.value = getScoutSystemUrl();
      if (status) status.textContent = input.value ? `已設定：${input.value}` : '尚未設定 ScoutSystem 網址。';
      btn.onclick = () => {
        const value = String(input.value || '').trim().replace(/\/$/, '');
        if (!/^https?:\/\//.test(value)) { alert('請輸入完整網址，例如 https://scoutsystem.vercel.app'); return; }
        localStorage.setItem('scoutsystem_import_base_url', value);
        if (status) status.textContent = `已設定：${value}`;
        renderCards();
      };
    }

    renderWindowChips();
    renderScopeChips();
    renderFieldChips();
    initScoutSystemConnect();
    // === 訪客計數器（純靜態頁，用免費 abacus.jasoncameron.dev，無需註冊，穩定 + CORS）===
    async function loadVisitCounter() {
      const el = document.getElementById('visit-count');
      if (!el) return;
      const NS = 'scout-circulars-hk';   // namespace（如想換新計數，改呢度）
      const KEY = 'visits';
      // 同一瀏覽器 30 分鐘內只 +1（避免重整狂刷）；其餘時間只讀取
      const last = Number(localStorage.getItem('scl_visit_ts') || 0);
      const fresh = (Date.now() - last) > 30 * 60 * 1000;
      const action = fresh ? 'hit' : 'get';
      const url = `https://abacus.jasoncameron.dev/${action}/${NS}/${KEY}`;
      try {
        const r = await fetch(url, { cache: 'no-store' });
        const d = await r.json();
        if (fresh) localStorage.setItem('scl_visit_ts', String(Date.now()));
        const n = (d && typeof d.value === 'number') ? d.value : null;
        el.textContent = n != null ? `累計瀏覽 ${n.toLocaleString()} 次` : '累計瀏覽 —';
      } catch (_) {
        // 服務掛咗都唔影響個站，但保留個框並顯示「—」（你話想睇到個位）
        el.textContent = '累計瀏覽 —';
      }
    }
    loadVisitCounter();

    loadCache();
  </script>
