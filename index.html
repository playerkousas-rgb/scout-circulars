<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>通告圖書館 v5.7</title>
  <style>
    :root {
      --bg: #02133e;
      --panel: #0f1728;
      --panel-2: #111d32;
      --line: #243553;
      --text: #e6eefb;
      --muted: #8ea2c6;
      --brand: #3b82f6;
      --brand-2: #11284f;
      --good: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 18px 40px rgba(0,0,0,.28);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .app { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
    .sidebar { border-right: 1px solid var(--line); background: var(--bg); padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
    .brand { padding: 8px 10px 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
    .brand h1 { margin: 0; font-size: 20px; line-height: 1.35; }
    .brand p { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
    .panel { background: linear-gradient(180deg, rgba(17,29,50,.95), rgba(11,20,36,.95)); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .meta { padding: 12px; margin-bottom: 12px; }
    .meta .big { font-size: 15px; font-weight: 700; }
    .meta .sub { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .meta-cell { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; }
    .meta-cell strong { display: block; font-size: 15px; margin-bottom: 4px; }
    .meta-cell span { color: var(--muted); font-size: 11px; }
    .sidebar input[type="search"] { width: 100%; border: 1px solid var(--line); background: #0b1424; color: var(--text); border-radius: 12px; padding: 11px 12px; margin-bottom: 12px; outline: none; }
    .accordion { display: grid; gap: 10px; }
    .region { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,.02); }
    .region > button { width: 100%; border: 0; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; background: transparent; color: var(--text); cursor: pointer; }
    .region > button:hover { background: rgba(255,255,255,.03); }
    .region.open > button { background: var(--brand-2); color: #d9e8ff; }
    /* 有通告(count>0)的地域：整列高亮底色 + 左側綠邊 */
    .region.has-updates { border-color: #22c55e; background: rgba(34,197,94,.18); box-shadow: 0 0 0 1px rgba(34,197,94,.35); }
    .region.has-updates > button { background: rgba(34,197,94,.22); color: #d7ffe6; font-weight: 700; }
    .region.has-updates.open > button { background: var(--brand-2); }
    .source-list { display: none; padding: 8px; gap: 8px; }
    .region.open .source-list { display: grid; }
    .source-btn { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #0b1424; color: var(--text); text-align: left; cursor: pointer; position: relative; }
    .source-btn:hover { background: #10203a; }
    .source-btn.active { background: linear-gradient(135deg, #173664, #2450a3); border-color: #4d82e7; }
    .source-btn small { display: block; margin-top: 4px; color: var(--muted); }
    /* 有通告的區會：整列綠底 + 粗左綠邊 */
    .source-btn.has-updates { background: rgba(34,197,94,.20); border-color: #22c55e; border-left: 5px solid #22c55e; color: #eafff2; font-weight: 600; }
    .source-btn.has-updates small { color: #7bedab; }
    .source-btn.has-updates:hover { background: rgba(34,197,94,.30); }
    .source-btn.has-updates.active { background: linear-gradient(135deg, #15643a, #1f9e5c); border-left: 5px solid #6effa0; }
    /* 彩色數字 badge */
    .count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 13px; font-weight: 800; background: rgba(255,255,255,.08); color: var(--muted); }
    .count-badge.hot { background: #22c55e; color: #04210f; box-shadow: 0 0 12px rgba(34,197,94,.7), 0 0 0 3px rgba(34,197,94,.25); }
    .content { padding: 24px; }
    .hero { padding: 18px; }
    .hero h2 { margin: 0 0 8px; font-size: 28px; line-height: 1.25; }
    .hero .sub { color: var(--muted); font-size: 14px; }
    /* 區會聯絡 icon bar */
    .contact-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
    .contact-ico { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #0b1424; color: #cdd9ec; text-decoration: none; transition: .15s; }
    .contact-ico:hover { background: #16263f; border-color: #3a5a8c; transform: translateY(-2px); }
    .contact-ico svg { width: 20px; height: 20px; flex: 0 0 20px; }
    .contact-ico.fb { border-color: rgba(24,119,242,.5); }
    .contact-ico.fb:hover { background: rgba(24,119,242,.18); }
    .contact-ico.ig { border-color: rgba(214,41,118,.5); }
    .contact-ico.ig:hover { background: rgba(214,41,118,.18); }
    .contact-ico.map { border-color: rgba(34,197,94,.5); }
    .contact-ico.map:hover { background: rgba(34,197,94,.18); }
    .contact-ico.yt { border-color: rgba(255,0,0,.5); }
    .contact-ico.yt:hover { background: rgba(255,0,0,.16); }
    .contact-ico.email { border-color: rgba(234,179,8,.5); }
    .contact-ico.email:hover { background: rgba(234,179,8,.16); }
    .contact-ico.tel { cursor: default; }
    .controls { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .controls input[type="search"] { flex: 1; min-width: 240px; border: 1px solid var(--line); background: #09111f; color: var(--text); border-radius: 12px; padding: 12px 14px; outline: none; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #0b1424; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--line); background: #0b1424; color: var(--muted); border-radius: 999px; padding: 9px 13px; cursor: pointer; }
    .chip.active { background: linear-gradient(135deg, #2153ad, #1b82f8); color: #fff; border-color: #4d82e7; }
    /* ★ 收藏分頁：同時間視窗並排，但用金色區分「唔係時間範圍」*/
    .chip-bm { border-color: rgba(250,204,21,.4); color: #facc15; margin-left: 6px; }
    .chip-bm:hover { background: rgba(250,204,21,.1); }
    .chip-bm.active { background: linear-gradient(135deg, #a16207, #facc15); color: #1a1205; border-color: #facc15; font-weight: 700; }
    .chip-n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: rgba(0,0,0,.28); font-size: 11px; font-weight: 700; }
    .scope-chips { display: flex; gap: 8px; }
    .scope-chip { border: 1px solid var(--line); background: #0b1424; color: var(--muted); border-radius: 12px; padding: 10px 14px; cursor: pointer; font-size: 13px; }
    .scope-chip.active { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; border-color: #c084fc; }
    .field-label { color: var(--muted); font-size: 13px; align-self: center; }
    .field-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    /* 支部標籤（單選）：綠色系，同時間視窗（藍）／收藏（金）分開 */
    .chip.chip-branch.active { background: linear-gradient(135deg, #15803d, #22c55e); color: #03200f; border-color: #4ade80; font-weight: 700; }
    .chip.chip-branch.chip-all.active { background: linear-gradient(135deg, #2153ad, #1b82f8); color: #fff; border-color: #4d82e7; }
    .status { margin-top: 12px; color: var(--muted); font-size: 13px; }
    .msg { margin-top: 18px; padding: 18px; border-radius: var(--radius); border: 1px solid var(--line); background: rgba(255,255,255,.03); }
    .msg.error { border-color: rgba(239,68,68,.4); color: #ffd6d6; background: rgba(127,29,29,.18); }
    .cards { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    .card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--radius); border: 1px solid var(--line); background: linear-gradient(180deg, rgba(15,23,40,.92), rgba(8,14,26,.95)); box-shadow: var(--shadow); }
    .badge { display: inline-flex; align-items: center; gap: 6px; width: fit-content; font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(59,130,246,.35); background: rgba(29,78,216,.18); color: #b6d4ff; }
    .card h3 { margin: 0; font-size: 18px; line-height: 1.45; }
    /* 書籤（★）——瀏覽器本機儲存，唔會上傳 */
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .star-btn { flex: 0 0 auto; background: transparent; border: 1px solid var(--line); color: #6b7f9e;
                border-radius: 10px; width: 38px; height: 38px; font-size: 19px; line-height: 1;
                cursor: pointer; transition: .15s; }
    .star-btn:hover { border-color: rgba(250,204,21,.6); color: #facc15; background: rgba(250,204,21,.08); }
    .star-btn.on { border-color: rgba(250,204,21,.7); color: #facc15; background: rgba(250,204,21,.14); }
    .star-btn:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
    .bm-note { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 13px;
               color: #ffe9a8; background: rgba(250,204,21,.08); border: 1px solid rgba(250,204,21,.25); }
    .bm-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .bm-tools button { border: 1px solid var(--line); background: rgba(255,255,255,.04); color: #cfe3ff;
                       border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
    .bm-tools button:hover { background: rgba(255,255,255,.09); }
    .bm-tools button.danger:hover { border-color: rgba(239,68,68,.5); color: #fca5a5; }
    /* 原站已移除：淡化 + 明示，但由用戶自己決定幾時取消收藏 */
    .bm-gone { opacity: .72; border-color: rgba(239,68,68,.28); }
    .bm-gone .gone-tag { display: inline-flex; align-items: center; width: fit-content; gap: 5px;
                         font-size: 12px; padding: 5px 9px; border-radius: 999px; color: #fca5a5;
                         background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); }

    /* enrich 補充資料（截止/對象/費用）*/
    .ex-box { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: rgba(34,197,94,.07); border: 1px solid rgba(34,197,94,.22); }
    .ex-row { display: flex; align-items: flex-start; gap: 7px; font-size: 13px; color: #d7e6f5; line-height: 1.4; }
    .ex-ico { flex: 0 0 auto; font-size: 13px; }
    .ex-row .ex-deadline { color: #f87171; }
    .meta-row { display: flex; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; margin-top: auto; }
    .meta-row .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta-row .link { color: #cfe3ff; }
    code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 8px; }
    .ss-connect { margin-top: 12px; padding: 12px; border-radius: 14px; border: 1px solid rgba(59,130,246,.35); background: rgba(59,130,246,.08); display: grid; gap: 8px; }
    .ss-connect-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .ss-connect input { flex: 1; min-width: 260px; border: 1px solid var(--line); background: #09111f; color: var(--text); border-radius: 12px; padding: 10px 12px; outline: none; }
    .ss-save, .ss-import { border: 1px solid rgba(59,130,246,.45); background: #173664; color: #d9e8ff; border-radius: 12px; padding: 9px 12px; cursor: pointer; font-weight: 700; }
    .ss-save:hover, .ss-import:hover { background: #2450a3; }
    .ss-import { width: 100%; }

    /* ── 分享 ─────────────────────────────────────────────── */
    .card-actions { display: flex; gap: 8px; }
    .card-actions .ss-import { flex: 1; }
    .share-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
                 background: #0b1424; color: #cfe3ff; border-radius: 12px; padding: 9px 12px; cursor: pointer; font-weight: 700; }
    .share-btn:hover { background: #16263f; border-color: #3a5a8c; }
    .share-btn svg { width: 16px; height: 16px; }
    .share-btn:focus-visible, .share-opt:focus-visible, .share-close:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }

    .share-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(2,8,23,.66); backdrop-filter: blur(3px);
                      display: flex; align-items: center; justify-content: center; padding: 16px; }
    .share-sheet { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: 20px;
                   border: 1px solid var(--line); background: linear-gradient(180deg, #111d32, #0b1424); box-shadow: var(--shadow); padding: 18px; }
    .share-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .share-head h3 { margin: 0; font-size: 17px; line-height: 1.4; }
    .share-head .sub { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .share-close { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 10px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; line-height: 1; }
    .share-close:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .share-section { margin-top: 16px; }
    .share-section h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .share-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    .share-opt { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 12px 6px;
                 border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--text); cursor: pointer; font-size: 12px; text-decoration: none; transition: .15s; }
    .share-opt:hover { background: rgba(255,255,255,.08); transform: translateY(-1px); }
    .share-opt svg { width: 26px; height: 26px; }
    .share-opt.wa svg { fill: #25d366; } .share-opt.tg svg { fill: #29a9eb; } .share-opt.fb svg { fill: #1877f2; }
    .share-opt.x svg { fill: #e7e9ea; } .share-opt.line svg { fill: #06c755; } .share-opt.mail svg { stroke: #eab308; fill: none; stroke-width: 2; }
    .share-opt.sys svg, .share-opt.copy svg, .share-opt.dl svg { stroke: #93c5fd; fill: none; stroke-width: 2; }
    .share-opt[disabled], .share-opt.disabled { opacity: .45; cursor: not-allowed; transform: none; }

    /* 圖片預覽 */
    .share-img-box { margin-top: 8px; border: 1px solid var(--line); border-radius: 14px; background: #0a1120; padding: 10px; }
    .share-img-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    .share-img-toolbar select { font: inherit; background: #0b1424; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
    .share-preview { display: block; width: 100%; max-height: 46vh; object-fit: contain; border-radius: 8px; margin-top: 8px; background: #fff; }
    .share-img-status { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px; }
    .share-img-status.err { color: #fca5a5; }
    .share-img-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .share-img-actions button { flex: 1; min-width: 120px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid rgba(59,130,246,.45); background: #173664; color: #d9e8ff; border-radius: 12px; padding: 10px 12px; cursor: pointer; font-weight: 700; }
    .share-img-actions button:hover { background: #2450a3; }
    .share-img-actions button[disabled] { opacity: .5; cursor: not-allowed; }
    .share-img-actions button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
    .share-hint { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .share-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: #0f172a; color: #e6eefb;
                   border: 1px solid #3a5a8c; padding: 10px 16px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow); pointer-events: none; opacity: 0; transition: opacity .2s; }
    .share-toast.show { opacity: 1; }
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.25); border-top-color: #93c5fd; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .content { padding: 16px; }
      .hero h2 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
  <h1>通告圖書館 v5.7</h1>
  <p>每天自動更新全港各區地域總會通告<br>擇要未必完全準確，詳情請開附件參閱詳細通告。</p>
  <p style="margin-top:10px;"><a href="errors.html" style="color:#93c5fd;font-size:12px;">→ 診斷儀表板</a></p>
</div>

      <div class="panel meta" id="sidebar-meta">
        <div class="big">讀取中…</div>
        <div class="sub">等待 GitHub Raw cache.json</div>
      </div>

      <input id="district-search" type="search" placeholder="搜尋地域 / 區會…">
      <div class="accordion" id="accordion"></div>
    </aside>

    <main class="content">
      <section class="panel hero">
        <h2 id="page-title">載入中…</h2>
        <div class="sub" id="page-subtitle">目前支援分區或全港層級瀏覽。</div>

        <div class="contact-bar" id="contact-bar"></div>

        <div class="controls">
          <input id="keyword" type="search" placeholder="搜尋通告名稱…">
          <div class="scope-chips" id="scope-chips">
            <button class="scope-chip active" data-scope="current">目前分頁</button>
            <button class="scope-chip" data-scope="global">全港搜尋</button>
          </div>
        </div>

        <div class="controls">
          <span class="field-label">支部：</span>
          <div class="field-chips" id="branch-chips"></div>
        </div>

        <div class="controls">
          <div class="chips" id="window-chips"></div>
        </div>

        <div class="status" id="status-line"></div>
        <div class="ss-connect">
          <div class="ss-connect-row"><strong>ScoutSystem 接入</strong><span class="sub">設定一次後，每張通告可直接加入你的旅團系統。</span></div>
          <div class="ss-connect-row">
            <input id="scoutsystem-url" placeholder="例如：https://troop-portal.vercel.app">
            <button class="ss-save" id="save-scoutsystem-url">儲存 ScoutSystem 網址</button>
          </div>
          <div class="status" id="scoutsystem-status"></div>
        </div>
      </section>

      <section id="messages"></section>
      <section class="cards" id="cards"></section>
      <footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 13px;">
        <div id="visit-counter" style="margin-bottom: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid var(--line);">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#7bb0ff" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="visit-count">累計瀏覽 …</span>
        </div>
        <div>Copyright &copy; 2026 SCOUT SYSTEM</div>
      </footer>
    </main>
  </div>

  <script>
    const RAW_CACHE_URL = 'https://raw.githubusercontent.com/playerkousas-rgb/scout-circulars/main/cache.json';
    const RAW_ENRICH_URL = 'https://raw.githubusercontent.com/playerkousas-rgb/scout-circulars/main/enrich.json';
    const TIME_WINDOWS = [
      { id: '1d', label: '今天', days: 1 },
      { id: '7d', label: '7天', days: 7 },
      { id: '15d', label: '15天', days: 15 },
      { id: '30d', label: '30天', days: 30 },
      { id: '90d', label: '3個月', days: 90 },
      { id: '180d', label: '6個月', days: 180 },
    ];

    // ── 支部篩選 ──────────────────────────────────────────────
    // 用戶唔使再打字揀成員：一排支部標籤，撳一個即刻過濾。
    // 「童軍」唔可以命中「幼童軍 / 深資童軍 / 樂行童軍」，所以標題同 audience
    // 都用 longest-match 掃描，較長名稱先配對。
    const BRANCH_TAGS = [
      { id: 'ALL', label: '全部' },
      { id: '小童軍', label: '小童軍' },
      { id: '幼童軍', label: '幼童軍' },
      { id: '童軍', label: '童軍' },
      { id: '深資童軍', label: '深資童軍' },
      { id: '樂行童軍', label: '樂行童軍' },
      { id: '領袖', label: '領袖' },
      { id: '家長', label: '家長' },
      { id: '會務委員', label: '會務委員' },
    ];
    // 掃描標題 / audience 用嘅詞表：包埋唔係標籤嘅成員詞（成年成員、公眾…），
    // 咁樣「成年成員」先唔會被錯拆成「成員」，「所有成員」都唔會漏。
    const KNOWN_MEMBERS = [
      '小童軍', '幼童軍', '童軍', '深資童軍', '樂行童軍',
      '領袖', '家長', '成年成員', '會務委員', '公眾', '親友', '所有成員',
    ];

    function normalizeSearchText(value) {
      return String(value ?? '').normalize('NFKC').toLowerCase().trim();
    }

    const NORMALIZED_MEMBERS_LONGEST_FIRST = KNOWN_MEMBERS
      .map(normalizeSearchText)
      .sort((a, b) => b.length - a.length);

    function extractMemberTokens(text) {
      // 對沒有固定分隔符的文字採用 longest-match 掃描：「深資童軍」唔會拆成「童軍」。
      const value = normalizeSearchText(text);
      const tokens = [];
      let index = 0;
      while (index < value.length) {
        const matched = NORMALIZED_MEMBERS_LONGEST_FIRST.find(member => value.startsWith(member, index));
        if (matched) {
          tokens.push(matched);
          index += matched.length;
        } else {
          index += 1;
        }
      }
      return [...new Set(tokens)];
    }

    // 決定一張通告屬於邊啲支部：
    //   1. enrich.json 有 audience（PDF 內文抽出嚟）→ 以佢為準，最可靠
    //   2. 冇 audience（舊通告 / 抽唔到）→ 退而求其次睇標題
    // 「所有成員」當作所有支部都命中。
    // 標題入面「香港童軍總會」嗰類機構名唔特別處理 —— 用戶要精細啲可以配合關鍵字搜尋。
    function itemBranches(item, enrich) {
      const audience = enrich?.audience || '';
      const tokens = audience
        ? extractMemberTokens(audience)
        : extractMemberTokens(item.title || '');
      if (tokens.includes('所有成員')) {
        return new Set(BRANCH_TAGS.filter(t => t.id !== 'ALL').map(t => normalizeSearchText(t.id)));
      }
      return new Set(tokens);
    }

    function matchesBranch(item, enrich, branchId) {
      if (!branchId || branchId === 'ALL') return true;
      return itemBranches(item, enrich).has(normalizeSearchText(branchId));
    }

    // 關鍵字：淨係搜通告名稱（包含配對）。支部由標籤負責，唔再撈埋一齊。
    function matchesKeyword(item, query) {
      const q = normalizeSearchText(query);
      if (!q) return true;
      return normalizeSearchText(item.title).includes(q);
    }

    function matchesSearchQuery(item, enrich, query, branchId) {
      return matchesKeyword(item, query) && matchesBranch(item, enrich, branchId);
    }

    const state = {
      cache: null,
      enrich: {},
      grouped: {},
      regions: {},
      sourceOrder: [],
      activeSource: null,
      keyword: '',
      windowId: '1d',
      searchRegionKeyword: '',
      searchScope: 'current', // 'current' | 'global'
      branch: 'ALL',     // 支部標籤（單選）：'ALL' | '小童軍' | '幼童軍' | …
      bookmarks: {},     // key -> 收藏快照（見 BOOKMARK_KEY 說明）
      lastSource: null,  // 撳 ★ 分頁之前喺邊個來源，用嚟返返去
    };

    // ── 書籤 ────────────────────────────────────────────────
    // 存喺瀏覽器 localStorage，唔會上傳、唔會跨裝置同步。
    //
    // 存快照（標題/日期/連結）而唔係淨係 key：區會會清走舊通告，
    // 到時 cache.json 冇咗嗰筆，若只存 key 就會變成一條揾唔返嘅記錄。
    // 保留快照 + 標示「原站已移除」，用戶起碼知自己收藏過乜、
    // 亦可以自己決定幾時取消 —— 系統唔會擅自幫佢刪嘢。
    const BOOKMARK_KEY = 'scl_bookmarks_v1';

    function loadBookmarks() {
      try {
        const raw = localStorage.getItem(BOOKMARK_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
        // 一律正規化成快照物件（兼容只存過時間戳嗰個版本）
        const out = {};
        for (const [k, v] of Object.entries(parsed)) {
          out[k] = (v && typeof v === 'object')
            ? v
            : { saved_at: new Date(typeof v === 'number' ? v : Date.now()).toISOString() };
        }
        return out;
      } catch (_) {
        return {};   // 儲存壞咗／被停用都唔應該令成個頁面掛
      }
    }

    function saveBookmarks() {
      try {
        localStorage.setItem(BOOKMARK_KEY, JSON.stringify(state.bookmarks));
        return true;
      } catch (_) {
        alert('收藏儲存唔到 —— 可能係瀏覽器停用咗本機儲存，或者無痕模式。');
        return false;
      }
    }

    function isBookmarked(item) {
      return Object.prototype.hasOwnProperty.call(state.bookmarks, makeCircularKey(item));
    }

    function toggleBookmark(item) {
      const key = makeCircularKey(item);
      if (Object.prototype.hasOwnProperty.call(state.bookmarks, key)) {
        delete state.bookmarks[key];
      } else {
        state.bookmarks[key] = {
          title: item.title || '',
          url: item.url || item.pdf_url || '',
          pdf_url: item.pdf_url || item.url || '',
          date: item.date || item.captured_date || '',
          captured_date: item.captured_date || item.date || '',
          source_site: item.source_site || state.activeSource || '',
          region: item.region || '',
          saved_at: new Date().toISOString(),
        };
      }
      saveBookmarks();
      return isBookmarked(item);
    }

    function bookmarkCount() {
      return Object.keys(state.bookmarks).length;
    }

    function liveItemsByKey() {
      const live = new Map();
      for (const src of state.sourceOrder) {
        for (const it of (state.grouped[src] || [])) live.set(makeCircularKey(it), it);
      }
      return live;
    }

    // 收藏清單：以 cache 最新資料為準；cache 冇咗就用快照並標示 _bmGone。
    // 刻意唔自動刪 —— 由用戶自己撳 ★ 取消，系統唔會擅自幫佢清嘢。
    function getBookmarkItems() {
      const live = liveItemsByKey();
      return Object.entries(state.bookmarks).map(([key, snap]) => {
        const hit = live.get(key);
        return hit ? { ...hit, _bmSavedAt: snap.saved_at }
                   : { ...snap, _bmSavedAt: snap.saved_at, _bmGone: true };
      }).sort((a, b) => String(b._bmSavedAt || '').localeCompare(String(a._bmSavedAt || '')));
    }

    const $ = (sel) => document.querySelector(sel);
    const accordionEl = $('#accordion');
    const cardsEl = $('#cards');
    const messagesEl = $('#messages');

    function getRawUrl() {
      const params = new URLSearchParams(location.search);
      const raw = params.get('raw') || RAW_CACHE_URL;
      return `${raw}${raw.includes('?') ? '&' : '?'}t=${Date.now()}`;
    }

    function getEnrichUrl() {
      const params = new URLSearchParams(location.search);
      // 若用 ?raw= 覆蓋 cache，enrich 自動取同目錄的 enrich.json；否則用預設
      let base = params.get('enrich');
      if (!base) {
        const rawCache = params.get('raw');
        base = rawCache ? rawCache.replace(/cache\.json.*$/, 'enrich.json') : RAW_ENRICH_URL;
      }
      return `${base}${base.includes('?') ? '&' : '?'}t=${Date.now()}`;
    }

    // 載入 enrich.json（失敗都唔影響主畫面）
    async function loadEnrich() {
      try {
        const r = await fetch(getEnrichUrl(), { cache: 'no-store' });
        if (r.ok) state.enrich = await r.json();
      } catch (_) { state.enrich = {}; }
    }

    function parseDate(value) {
      if (!value) return null;
      const m = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
      const year = Number(m[1]);
      if (year < 2024 || year > 2028) return null;
      const d = new Date(`${m[1]}-${m[2]}-${m[3]}T00:00:00+08:00`);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function formatDate(value) {
      const d = parseDate(value);
      if (!d) return '日期不明';
      return `${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function getScoutSystemUrl() {
      return (localStorage.getItem('scoutsystem_import_base_url') || '').replace(/\/$/, '');
    }

    function makeCircularKey(item) {
      return item.pdf_url || item.url || `${item.source_site || ''}|${item.title || ''}|${item.captured_date || item.date || ''}`;
    }

    function buildScoutSystemImportUrl(item, ex) {
      const base = getScoutSystemUrl();
      if (!base) return '';
      const href = item.url || item.pdf_url || '';
      const params = new URLSearchParams();
      params.set('title', item.title || '');
      params.set('sourceSite', item.source_site || state.activeSource || '');
      params.set('region', item.region || '');
      params.set('date', item.date || item.captured_date || '');
      params.set('sourceUrl', href);
      params.set('attachmentUrl', item.pdf_url || href);
      params.set('pdf_url', item.pdf_url || href);
      params.set('key', makeCircularKey(item));
      if (ex?.deadline) params.set('deadline', ex.deadline);
      if (ex?.audience) params.set('audience', ex.audience);
      if (ex?.fee) params.set('fee', ex.fee);
      return `${base}/library/import?${params.toString()}`;
    }

    function buildGroupedFromFlat(notices) {
      const grouped = {};
      for (const item of notices || []) {
        const source = item.source_site || '未分類';
        grouped[source] ||= [];
        grouped[source].push({
          title: item.title || '',
          url: item.pdf_url || item.url || '',
          pdf_url: item.pdf_url || item.url || '',
          date: item.captured_date || item.date || '',
          captured_date: item.captured_date || item.date || '',
          source_site: source,
          region: item.region || '',
        });
      }
      return grouped;
    }

    function deriveRegions(grouped, metaRegions) {
      if (metaRegions && Object.keys(metaRegions).length) return metaRegions;
      const regions = {};
      for (const [source, arr] of Object.entries(grouped)) {
        const region = arr[0]?.region || '未分類';
        regions[region] ||= [];
        regions[region].push(source);
      }
      return regions;
    }

    function badgeHtml(n) {
      return `<span class="count-badge ${n > 0 ? 'hot' : ''}">${n}</span>`;
    }

    function sourceCount(source) {
      const items = state.grouped[source] || [];
      return items.filter(item => {
        const dateValue = item.date || item.captured_date || '';
        return inWindow(dateValue);
      }).length;
    }

    function getBucket(sourceId) {
      if (sourceId === 'ALL_SOURCES') {
        let all = [];
        for (const src of state.sourceOrder) {
          all = all.concat(state.grouped[src] || []);
        }
        return all;
      }
      if (sourceId && sourceId.startsWith('REGION:')) {
        const regionName = sourceId.substring(7);
        const sourcesInRegion = state.regions[regionName] || [];
        let all = [];
        for (const src of sourcesInRegion) {
          all = all.concat(state.grouped[src] || []);
        }
        return all;
      }
      return state.grouped[sourceId] || [];
    }

    function getSourceTitle(sourceId) {
      if (sourceId === 'BOOKMARKS') return '★ 我的收藏';
      if (sourceId === 'ALL_SOURCES') return '全港 (所有層級)';
      if (sourceId && sourceId.startsWith('REGION:')) return sourceId.substring(7) + ' (全部)';
      return sourceId || '未選擇來源';
    }

    function currentWindow() {
      return TIME_WINDOWS.find(x => x.id === state.windowId) || TIME_WINDOWS[2];
    }

    function inWindow(itemDate) {
      const win = currentWindow();
      if (win.days == null) return true;
      const d = parseDate(itemDate);
      if (!d) return false;
      const now = new Date();
      const diff = now.getTime() - d.getTime();
      return diff <= win.days * 24 * 60 * 60 * 1000;
    }

    function getCurrentItems() {
      let items;
      // 收藏夾：刻意唔套用時間視窗。用戶三個月前收藏嘅通告，
      // 唔應該因為「今天」視窗而喺自己收藏夾入面消失 —— 咁就等於揾唔返。
      if (state.activeSource === 'BOOKMARKS') {
        items = getBookmarkItems();
        if (state.keyword || state.branch !== 'ALL') {
          items = items.filter(item => {
            const ex = state.enrich[item.pdf_url] || state.enrich[item.url] || null;
            return matchesSearchQuery(item, ex, state.keyword, state.branch);
          });
        }
        return items;   // 已按收藏時間排序，唔再依日期重排
      }

      if (state.searchScope === 'global') {
        items = [];
        for (const src of state.sourceOrder) {
          items = items.concat(state.grouped[src] || []);
        }
      } else {
        items = [...getBucket(state.activeSource)];
      }

      items = items.filter(item => {
        const dateValue = item.date || item.captured_date || '';
        if (!inWindow(dateValue)) return false;
        if (state.keyword || state.branch !== 'ALL') {
          const ex = state.enrich[item.pdf_url] || state.enrich[item.url] || null;
          return matchesSearchQuery(item, ex, state.keyword, state.branch);
        }
        return true;
      });

      items.sort((a, b) => {
        const da = parseDate(a.date || a.captured_date)?.getTime() ?? -Infinity;
        const db = parseDate(b.date || b.captured_date)?.getTime() ?? -Infinity;
        if (db !== da) return db - da;
        return String(a.title || '').localeCompare(String(b.title || ''), 'zh-Hant');
      });

      return items;
    }

    function renderWindowChips() {
      const wrap = $('#window-chips');
      wrap.innerHTML = '';
      for (const win of TIME_WINDOWS) {
        const btn = document.createElement('button');
        btn.className = `chip ${state.activeSource !== 'BOOKMARKS' && state.windowId === win.id ? 'active' : ''}`;
        btn.textContent = win.label;
        btn.onclick = () => {
          state.windowId = win.id;
          // 由收藏夾撳時間掣 = 想睇返一般通告，順手切返上次嗰個來源
          if (state.activeSource === 'BOOKMARKS') {
            state.activeSource = state.lastSource || 'ALL_SOURCES';
          }
          renderWindowChips();
          renderAccordion();
          renderSidebarMeta();
          renderHeader();
          renderCards();
        };
        wrap.appendChild(btn);
      }

      // ★ 收藏：同時間視窗並排嘅獨立分頁。
      // 刻意唔當佢係「另一個時間範圍」—— 收藏夾唔受日期過濾影響。
      const bmBtn = document.createElement('button');
      const n = bookmarkCount();
      bmBtn.className = `chip chip-bm ${state.activeSource === 'BOOKMARKS' ? 'active' : ''}`;
      bmBtn.innerHTML = `★ 收藏${n ? ` <span class="chip-n">${n}</span>` : ''}`;
      bmBtn.title = '睇返你收藏咗嘅通告（唔受上面時間範圍影響）';
      bmBtn.onclick = () => {
        if (state.activeSource === 'BOOKMARKS') {
          state.activeSource = state.lastSource || 'ALL_SOURCES';   // 再撳一次返返去
        } else {
          state.lastSource = state.activeSource;
          state.activeSource = 'BOOKMARKS';
        }
        renderWindowChips();
        renderAccordion();
        renderSidebarMeta();
        renderHeader();
        renderCards();
      };
      wrap.appendChild(bmBtn);
    }

    function renderScopeChips() {
      const wrap = $('#scope-chips');
      wrap.innerHTML = '';
      const scopes = [
        { id: 'current', label: '目前分頁' },
        { id: 'global', label: '全港搜尋' },
      ];
      for (const sc of scopes) {
        const btn = document.createElement('button');
        btn.className = `scope-chip ${state.searchScope === sc.id ? 'active' : ''}`;
        btn.textContent = sc.label;
        btn.dataset.scope = sc.id;
        btn.onclick = () => {
          state.searchScope = sc.id;
          renderScopeChips();
          renderHeader();
          renderCards();
        };
        wrap.appendChild(btn);
      }
    }

    // 支部標籤：一排掣，撳一個即刻只睇嗰個支部。唔顯示數字 —— 用戶係童軍就淨係想睇童軍。
    function renderBranchChips() {
      const wrap = $('#branch-chips');
      if (!wrap) return;
      wrap.innerHTML = '';
      for (const tag of BRANCH_TAGS) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `chip chip-branch${tag.id === 'ALL' ? ' chip-all' : ''}${state.branch === tag.id ? ' active' : ''}`;
        btn.dataset.branch = tag.id;
        btn.textContent = tag.label;
        btn.setAttribute('aria-pressed', state.branch === tag.id ? 'true' : 'false');
        btn.onclick = () => {
          // 再撳一次已選中嘅支部 = 取消，返回「全部」
          state.branch = (state.branch === tag.id && tag.id !== 'ALL') ? 'ALL' : tag.id;
          renderBranchChips();
          renderHeader();
          renderCards();
        };
        wrap.appendChild(btn);
      }
    }

    function renderSidebarMeta() {
      const totalSources = state.sourceOrder.length;
      const totalNotices = state.sourceOrder.reduce((sum, source) => sum + sourceCount(source), 0);
      const nonEmptySources = state.sourceOrder.filter(source => sourceCount(source) > 0).length;
      
      let isTodayError = false;
      const lastUpdateStr = state.cache?.last_updated;
      const hasErrors = state.cache?._meta?.has_errors === true;
      
      if (hasErrors && lastUpdateStr) {
        const updateDate = lastUpdateStr.substring(0, 10);
        const hkTime = new Date(new Date().getTime() + (8 * 60 * 60 * 1000));
        const todayHK = hkTime.toISOString().substring(0, 10);
        if (updateDate === todayHK) {
          isTodayError = true;
        }
      }
      
      const errorStyle = isTodayError ? 'color: var(--warn);' : '';
      
      $('#sidebar-meta').innerHTML = `
        <div class="big" style="${errorStyle}">最後更新：${escapeHtml(state.cache?.last_updated || '未有資料')}</div>
        <div class="sub">支援分區或全港層級瀏覽</div>
        <div class="meta-grid">
          <div class="meta-cell"><strong>${totalSources}</strong><span>來源</span></div>
          <div class="meta-cell"><strong>${nonEmptySources}</strong><span>有資料</span></div>
          <div class="meta-cell"><strong>${totalNotices}</strong><span>資產</span></div>
        </div>
      `;
    }

    function renderAccordion() {
      const q = state.searchRegionKeyword.toLowerCase().trim();
      accordionEl.innerHTML = '';

      // 我的收藏（偽來源，永遠置頂；唔受時間視窗影響）
      if (!q || '我的收藏'.includes(q) || 'bookmark'.includes(q)) {
        const bmEl = document.createElement('section');
        bmEl.className = 'region';
        const bmBtn = document.createElement('button');
        const bmTotal = bookmarkCount();
        bmBtn.innerHTML = `<span>★ 我的收藏</span>${badgeHtml(bmTotal)}`;
        if (bmTotal > 0) bmEl.classList.add('has-updates');
        if (state.activeSource === 'BOOKMARKS') bmEl.classList.add('open');
        bmBtn.onclick = () => {
          state.activeSource = 'BOOKMARKS';
          renderAccordion();
          renderHeader();
          renderCards();
        };
        bmEl.appendChild(bmBtn);
        accordionEl.appendChild(bmEl);
      }

      // All Levels Pseudo-Region
      if (!q || '全港 (所有層級)'.includes(q)) {
        const allEl = document.createElement('section');
        allEl.className = 'region';
        const totalAll = state.sourceOrder.reduce((sum, src) => sum + sourceCount(src), 0);
        
        const allBtn = document.createElement('button');
        allBtn.innerHTML = `<span>全港 (所有層級)</span>${badgeHtml(totalAll)}`;
        if (totalAll > 0) allEl.classList.add('has-updates');
        if (state.activeSource === 'ALL_SOURCES') allEl.classList.add('open');
        allBtn.onclick = () => {
          state.activeSource = 'ALL_SOURCES';
          renderAccordion();
          renderHeader();
          renderCards();
        };
        allEl.appendChild(allBtn);
        accordionEl.appendChild(allEl);
      }

      const regions = Object.entries(state.regions);
      for (const [regionName, sources] of regions) {
        const filteredSources = q
          ? sources.filter(src => src.toLowerCase().includes(q) || regionName.toLowerCase().includes(q))
          : sources;
        if (!filteredSources.length) continue;

        const regionEl = document.createElement('section');
        regionEl.className = 'region';
        const isRegionActive = state.activeSource === 'REGION:' + regionName;
        const shouldOpen = isRegionActive || filteredSources.includes(state.activeSource);
        if (shouldOpen) regionEl.classList.add('open');

        const total = filteredSources.reduce((sum, src) => sum + sourceCount(src), 0);
        if (total > 0) regionEl.classList.add('has-updates');
        const header = document.createElement('button');
        header.innerHTML = `<span>${escapeHtml(regionName)}</span>${badgeHtml(total)}`;
        header.onclick = () => regionEl.classList.toggle('open');
        regionEl.appendChild(header);

        const list = document.createElement('div');
        list.className = 'source-list';
        
        // Add "All in this Region" button
        if (filteredSources.length > 1 || true) {
          const allRegionBtn = document.createElement('button');
          allRegionBtn.className = `source-btn ${isRegionActive ? 'active' : ''} ${total > 0 ? 'has-updates' : ''}`;
          allRegionBtn.innerHTML = `<span>全部 (${escapeHtml(regionName)})</span><small>${total} 則</small>`;
          allRegionBtn.onclick = () => {
            state.activeSource = 'REGION:' + regionName;
            renderAccordion();
            renderHeader();
            renderCards();
          };
          list.appendChild(allRegionBtn);
        }

        for (const source of filteredSources) {
          const cnt = sourceCount(source);
          const btn = document.createElement('button');
          btn.className = `source-btn ${state.activeSource === source ? 'active' : ''} ${cnt > 0 ? 'has-updates' : ''}`;
          btn.innerHTML = `<span>${escapeHtml(source)}</span><small>${cnt} 則</small>`;
          btn.onclick = () => {
            state.activeSource = source;
            renderAccordion();
            renderHeader();
            renderCards();
          };
          list.appendChild(btn);
        }
        regionEl.appendChild(list);
        accordionEl.appendChild(regionEl);
      }

      if (!accordionEl.children.length) {
        accordionEl.innerHTML = '<div class="msg">找不到相符地域 / 區會。</div>';
      }
    }

    // /api/render 同 index.html 同一個 origin（Vercel 或 serve_local.py）。
    // 用 file:// 或純靜態伺服器開時冇呢個 API，可以用 ?render=https://scout-circulars.vercel.app/api/render 指去正式站。
    function getRenderEndpoint() {
      const params = new URLSearchParams(location.search);
      const override = params.get('render');
      if (override) return override.replace(/\/$/, '');
      if (location.protocol === 'file:') return 'https://scout-circulars.vercel.app/api/render';
      return '/api/render';
    }

    function buildRenderUrl(pdfUrl, page, dpi) {
      const p = new URLSearchParams({ url: pdfUrl, page: String(page || 1) });
      if (dpi) p.set('dpi', String(dpi));
      return `${getRenderEndpoint()}?${p.toString()}`;
    }

    // 分享用嘅連結：附件直連。編碼一次即可（已有 %XX 嘅唔會 double-encode）。
    function shareUrlFor(item) {
      const raw = item.pdf_url || item.url || '';
      try { return new URL(raw).href; } catch (_) { return raw; }
    }

    function shareTextFor(item, withUrl = true) {
      const date = item.date || item.captured_date || '';
      const ex = state.enrich[item.pdf_url] || state.enrich[item.url] || null;
      const lines = [
        `【${item.source_site || ''}】${item.title || '未命名通告'}`,
      ];
      const meta = [];
      if (date) meta.push(`發佈 ${date}`);
      if (ex?.deadline) meta.push(`截止 ${ex.deadline}`);
      if (ex?.audience) meta.push(`對象 ${ex.audience}`);
      if (ex?.fee) meta.push(`費用 ${ex.fee}`);
      if (meta.length) lines.push(meta.join('・'));
      if (withUrl) lines.push(shareUrlFor(item));
      return lines.join('\n');
    }

    function safeFileName(title, suffix) {
      const base = String(title || '通告').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60) || '通告';
      return `${base}${suffix}`;
    }

    let toastTimer = null;
    function showToast(message) {
      let el = document.querySelector('.share-toast');
      if (!el) { el = document.createElement('div'); el.className = 'share-toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (_) {
        // 舊瀏覽器 / 非 HTTPS：退而求其次用 execCommand
        try {
          const ta = document.createElement('textarea');
          ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          const ok = document.execCommand('copy');
          ta.remove();
          if (ok) return true;
        } catch (__) {}
        window.prompt('自動複製唔成功，請手動複製：', text);
        return false;
      }
    }

    function socialLinks(item) {
      const url = shareUrlFor(item);
      const text = shareTextFor(item, false);
      const eu = encodeURIComponent(url);
      const et = encodeURIComponent(text);
      const eboth = encodeURIComponent(`${text}\n${url}`);
      return [
        { id: 'wa', label: 'WhatsApp', href: `https://api.whatsapp.com/send?text=${eboth}` },
        { id: 'tg', label: 'Telegram', href: `https://t.me/share/url?url=${eu}&text=${et}` },
        { id: 'fb', label: 'Facebook', href: `https://www.facebook.com/sharer/sharer.php?u=${eu}` },
        { id: 'x', label: 'X', href: `https://twitter.com/intent/tweet?text=${et}&url=${eu}` },
        { id: 'line', label: 'LINE', href: `https://social-plugins.line.me/lineit/share?url=${eu}&text=${et}` },
        { id: 'mail', label: '電郵', href: `mailto:?subject=${encodeURIComponent(`${item.source_site || ''} ${item.title || '通告'}`.trim())}&body=${eboth}` },
      ];
    }

    let activeShare = null;   // { backdrop, cleanup }
    function closeShare() {
      if (!activeShare) return;
      try { activeShare.cleanup(); } catch (_) {}
      activeShare.backdrop.remove();
      activeShare = null;
    }

    function openShare(item) {
      closeShare();
      const url = shareUrlFor(item);
      const canWebShare = typeof navigator.share === 'function';
      const links = socialLinks(item);

      const backdrop = document.createElement('div');
      backdrop.className = 'share-backdrop';
      backdrop.innerHTML = `
        <div class="share-sheet" role="dialog" aria-modal="true" aria-labelledby="share-title">
          <div class="share-head">
            <div>
              <h3 id="share-title">${escapeHtml(item.title || '未命名通告')}</h3>
              <div class="sub">${escapeHtml(item.source_site || '')}${item.date || item.captured_date ? '・' + escapeHtml(item.date || item.captured_date) : ''}</div>
            </div>
            <button type="button" class="share-close" aria-label="關閉">×</button>
          </div>

          <div class="share-section">
            <h4>分享連結</h4>
            <div class="share-grid" data-role="links">
              ${canWebShare ? `<button type="button" class="share-opt sys" data-act="sys">${SHARE_SVG.sys}<span>更多…</span></button>` : ''}
              ${links.map(l => `<a class="share-opt ${l.id}" data-act="link" href="${escapeHtml(l.href)}" target="_blank" rel="noopener noreferrer">${SHARE_SVG[l.id]}<span>${escapeHtml(l.label)}</span></a>`).join('')}
              <button type="button" class="share-opt copy" data-act="copy-url">${SHARE_SVG.copy}<span>複製網址</span></button>
              <button type="button" class="share-opt copy" data-act="copy-text">${SHARE_SVG.copy}<span>複製文字</span></button>
            </div>
          </div>

          <div class="share-section">
            <h4>分享圖片（成張通告貼上去）</h4>
            <div class="share-grid">
              <button type="button" class="share-opt dl" data-act="img">${SHARE_SVG.img}<span>產生圖片</span></button>
            </div>
            <div class="share-img-box" data-role="imgbox" hidden>
              <div class="share-img-toolbar">
                <span data-role="pageinfo"></span>
                <label>頁數 <select data-role="pagesel"></select></label>
              </div>
              <img class="share-preview" data-role="preview" alt="通告預覽" hidden>
              <div class="share-img-status" data-role="imgstatus"></div>
              <div class="share-img-actions">
                <button type="button" data-act="img-share" hidden>${SHARE_SVG.sys}分享圖片</button>
                <button type="button" data-act="img-copy">${SHARE_SVG.copy}複製圖片</button>
                <button type="button" data-act="img-dl">${SHARE_SVG.dl}下載圖片</button>
              </div>
              <div class="share-hint">Instagram 唔接受網頁直接發帖：下載／分享圖片後，喺 IG 揀相上載即可。多頁通告可以逐頁產生。</div>
            </div>
          </div>
        </div>`;

      const sheet = backdrop.querySelector('.share-sheet');
      const imgbox = backdrop.querySelector('[data-role="imgbox"]');
      const preview = backdrop.querySelector('[data-role="preview"]');
      const imgstatus = backdrop.querySelector('[data-role="imgstatus"]');
      const pagesel = backdrop.querySelector('[data-role="pagesel"]');
      const pageinfo = backdrop.querySelector('[data-role="pageinfo"]');
      const btnImgShare = backdrop.querySelector('[data-act="img-share"]');
      const btnImgCopy = backdrop.querySelector('[data-act="img-copy"]');
      const btnImgDl = backdrop.querySelector('[data-act="img-dl"]');

      const img = { blob: null, page: 1, pages: 0, objectUrl: null, loading: false };
      const setStatus = (text, isErr = false) => { imgstatus.innerHTML = text; imgstatus.classList.toggle('err', isErr); };
      const setBusy = (busy) => { [btnImgShare, btnImgCopy, btnImgDl].forEach(b => b.disabled = busy || !img.blob); pagesel.disabled = busy; };

      async function loadPage(page) {
        img.loading = true; img.blob = null;
        setBusy(true);
        imgbox.hidden = false;
        setStatus(`<span class="spin"></span>正在把第 ${page} 頁轉做圖片…（原站慢嘅話可能要等十幾秒）`);
        try {
          const resp = await fetch(buildRenderUrl(url, page), { cache: 'default' });
          if (!resp.ok) {
            let msg = `HTTP ${resp.status}`;
            let code = '';
            try { const j = await resp.json(); msg = j.message || msg; code = j.error || ''; } catch (_) {}
            const friendly = {
              not_pdf: '呢個連結唔係 PDF（可能係網頁或 Google 表格），只能分享連結。',
              too_large: 'PDF 太大，唔轉圖了，請分享連結。',
              encrypted: 'PDF 有密碼保護，轉唔到圖。',
              fetch_timeout: '原站回應太慢，遲啲再試。',
              fetch_failed: '連唔到原站（可能已移除或暫時死咗）。',
              renderer_unavailable: '伺服器未設定圖片轉換（本機請用 serve_local.py）。',
            }[code] || msg;
            throw new Error(friendly);
          }
          const blob = await resp.blob();
          if (!blob.type.startsWith('image/')) throw new Error('伺服器回覆唔係圖片');
          img.blob = blob; img.page = page;
          img.pages = Number(resp.headers.get('X-Pdf-Pages')) || img.pages || 1;
          if (img.objectUrl) URL.revokeObjectURL(img.objectUrl);
          img.objectUrl = URL.createObjectURL(blob);
          preview.src = img.objectUrl; preview.hidden = false;
          // 頁數選單
          pagesel.innerHTML = '';
          for (let i = 1; i <= img.pages; i++) {
            const o = document.createElement('option'); o.value = String(i); o.textContent = `第 ${i} 頁`; if (i === page) o.selected = true; pagesel.appendChild(o);
          }
          pagesel.parentElement.style.display = img.pages > 1 ? '' : 'none';
          pageinfo.textContent = img.pages > 1 ? `共 ${img.pages} 頁，目前第 ${page} 頁` : '共 1 頁';
          const canShareFile = typeof navigator.canShare === 'function' && navigator.canShare({ files: [new File([blob], 'x.jpg', { type: blob.type })] });
          btnImgShare.hidden = !canShareFile;
          setStatus(`圖片已準備好（${Math.round(blob.size / 1024)} KB）。`);
        } catch (err) {
          preview.hidden = true; preview.removeAttribute('src');
          setStatus(`❌ ${escapeHtml(err.message || String(err))}`, true);
        } finally {
          img.loading = false;
          setBusy(false);
        }
      }

      const currentFile = () => new File([img.blob], safeFileName(item.title, img.pages > 1 ? `_p${img.page}.jpg` : '.jpg'), { type: img.blob.type || 'image/jpeg' });

      backdrop.addEventListener('click', async (e) => {
        if (e.target === backdrop) { closeShare(); return; }
        const el = e.target.closest('[data-act]');
        if (!el) return;
        const act = el.dataset.act;
        if (act === 'sys') {
          try { await navigator.share({ title: item.title || '通告', text: shareTextFor(item, false), url }); }
          catch (err) { if (err && err.name !== 'AbortError') showToast('系統分享失敗，可以改用複製網址。'); }
        } else if (act === 'copy-url') {
          if (await copyText(url)) showToast('已複製通告網址');
        } else if (act === 'copy-text') {
          if (await copyText(shareTextFor(item, true))) showToast('已複製通告文字 + 網址');
        } else if (act === 'img') {
          if (!img.loading) loadPage(img.page || 1);
        } else if (act === 'img-share') {
          if (!img.blob) return;
          try { await navigator.share({ files: [currentFile()], title: item.title || '通告', text: shareTextFor(item, false) }); }
          catch (err) { if (err && err.name !== 'AbortError') showToast('分享失敗，可以改用下載圖片。'); }
        } else if (act === 'img-copy') {
          if (!img.blob) return;
          try {
            if (!navigator.clipboard || typeof ClipboardItem === 'undefined') throw new Error('unsupported');
            // 大部分瀏覽器剪貼簿只收 PNG，JPG 要先轉一轉
            let blob = img.blob;
            if (blob.type !== 'image/png') {
              const bmp = await createImageBitmap(blob);
              const cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height;
              cv.getContext('2d').drawImage(bmp, 0, 0);
              blob = await new Promise(res => cv.toBlob(res, 'image/png'));
            }
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            showToast('已複製圖片，可以直接貼落 WhatsApp / Telegram');
          } catch (_) {
            showToast('呢個瀏覽器唔支援複製圖片，請用「下載圖片」。');
          }
        } else if (act === 'img-dl') {
          if (!img.blob) return;
          const a = document.createElement('a');
          a.href = img.objectUrl; a.download = currentFile().name; document.body.appendChild(a); a.click(); a.remove();
          showToast('已開始下載圖片');
        }
      });
      backdrop.querySelector('.share-close').onclick = closeShare;
      pagesel.onchange = () => { const p = Number(pagesel.value) || 1; if (!img.loading && p !== img.page) loadPage(p); };
      const onKey = (e) => { if (e.key === 'Escape') closeShare(); };
      document.addEventListener('keydown', onKey);

      document.body.appendChild(backdrop);
      activeShare = { backdrop, cleanup: () => { document.removeEventListener('keydown', onKey); if (img.objectUrl) URL.revokeObjectURL(img.objectUrl); } };
      setBusy(false);
      sheet.querySelector('.share-close').focus();
    }

    function renderContactBar() {
      const bar = $('#contact-bar');
      if (!bar) return;
      const src = state.activeSource;
      // 全港搜尋模式或揀全港 / 整個地域時不顯示單一區會聯絡
      if (state.searchScope === 'global' || !src || src === 'ALL_SOURCES' || src.startsWith('REGION:')) { bar.innerHTML = ''; return; }
      const c = (typeof CONTACTS !== 'undefined' && CONTACTS[src]) || null;
      if (!c) { bar.innerHTML = ''; return; }
      const items = [];
      if (c.fb)  items.push(`<a class="contact-ico fb" href="${c.fb}" target="_blank" rel="noopener" title="Facebook">${SVG.fb}</a>`);
      if (c.ig)  items.push(`<a class="contact-ico ig" href="${c.ig}" target="_blank" rel="noopener" title="Instagram">${SVG.ig}</a>`);
      if (c.yt)  items.push(`<a class="contact-ico yt" href="${c.yt}" target="_blank" rel="noopener" title="YouTube">${SVG.yt}</a>`);
      if (c.web) items.push(`<a class="contact-ico web" href="${c.web}" target="_blank" rel="noopener" title="官網">${SVG.web}</a>`);
      if (c.map) items.push(`<a class="contact-ico map" href="${c.map}" target="_blank" rel="noopener" title="${escapeHtml(c.address||'地址')}">${SVG.map}</a>`);
      if (c.tel) items.push(`<a class="contact-ico tel" href="tel:${c.tel.replace(/\s/g,'')}" title="電話：${escapeHtml(c.tel)}">${SVG.tel}</a>`);
      if (c.email) items.push(`<a class="contact-ico email" href="mailto:${c.email}" title="電郵：${escapeHtml(c.email)}">${SVG.email}</a>`);
      bar.innerHTML = items.join('');
    }

    function renderHeader() {
      renderContactBar();
      const current = getCurrentItems().length;
      $('#page-title').textContent = state.searchScope === 'global' ? '全港搜尋' : getSourceTitle(state.activeSource);

      let subtitle = '請先選擇一個來源。';
      if (state.activeSource === 'BOOKMARKS') subtitle = '你收藏咗嘅通告，唔受上面時間範圍影響。只存喺呢部機。';
      else if (state.activeSource === 'ALL_SOURCES') subtitle = '目前顯示全港所有通告。';
      else if (state.activeSource && state.activeSource.startsWith('REGION:')) subtitle = `目前顯示 ${getSourceTitle(state.activeSource)} 所有區會的通告。`;
      else if (state.activeSource) subtitle = '';

      if (state.searchScope === 'global') {
        subtitle = `全港搜尋「${escapeHtml(state.keyword || '(未輸入)')}」— 忽略左邊分頁選擇。`;
      }

      const subEl = $('#page-subtitle');
      subEl.textContent = subtitle;
      subEl.style.display = subtitle ? '' : 'none';

      const scopeLabel = state.searchScope === 'global' ? '全港' : '目前分頁';
      const totalAll = state.sourceOrder.reduce((sum, src) => sum + (state.grouped[src] || []).length, 0);
      const totalCurrent = state.searchScope === 'global' ? totalAll : getBucket(state.activeSource).length;
      $('#status-line').innerHTML = `
        模式：<code>${scopeLabel}</code>
        ・視窗：<code>${escapeHtml(currentWindow().label)}</code>
        ${state.branch !== 'ALL' ? `・支部：<code>${escapeHtml(state.branch)}</code>` : ''}
        ・顯示：<code>${current}</code>
        ・本來源總數：<code>${totalCurrent}</code>
        ・cache：<code>${escapeHtml(state.cache?.meta?.version || state.cache?._meta?.version || 'unknown')}</code>
      `;
    }

    function renderCards() {
      messagesEl.innerHTML = '';
      cardsEl.innerHTML = '';

      if (!state.activeSource) {
        messagesEl.innerHTML = '<div class="msg">請先從左邊揀選一個地域 / 區會分頁。</div>';
        return;
      }

      const items = getCurrentItems();

      if (state.activeSource === 'BOOKMARKS') {
        if (!items.length) {
          messagesEl.innerHTML = '<div class="msg">仲未收藏任何通告。喺通告卡片右上角撳 ☆ 就可以加入收藏，' +
            '慢慢查完自己時間、問完朋友再決定。<br><small>收藏只存喺你部機嘅瀏覽器，唔會上傳，' +
            '亦唔會喺其他裝置出現。清除瀏覽器資料會一併清走。</small></div>';
          return;
        }
        const goneCount = items.filter(i => i._bmGone).length;
        let noteHtml = '';
        if (goneCount) {
          noteHtml = `<div class="bm-note">當中 ${goneCount} 則通告原站已經移除，即係已經報唔到。` +
            `記錄仍然保留俾你參考，想清走就撳嗰張卡片嘅 ★。</div>`;
        }
        messagesEl.innerHTML = noteHtml +
          `<div class="bm-tools">
             <button type="button" id="bm-copy">複製清單</button>
             ${goneCount ? `<button type="button" id="bm-clear-gone">清走已移除（${goneCount}）</button>` : ''}
             <button type="button" id="bm-clear" class="danger">清空收藏</button>
           </div>`;
        messagesEl.querySelector('#bm-copy').onclick = async () => {
          const text = items.map(i =>
            `• ${i.title || '未命名通告'}（${i.source_site || ''}${i.date || i.captured_date ? '，' + (i.date || i.captured_date) : ''}）\n  ${i.pdf_url || i.url || ''}`
          ).join('\n');
          try {
            await navigator.clipboard.writeText(text);
            alert(`已複製 ${items.length} 則通告，可以直接貼去 WhatsApp 問朋友。`);
          } catch (_) {
            // 剪貼簿權限唔一定俾，退而求其次俾用戶自己揀
            window.prompt('自動複製唔成功，你可以喺下面手動複製：', text);
          }
        };
        const clearGoneBtn = messagesEl.querySelector('#bm-clear-gone');
        if (clearGoneBtn) {
          clearGoneBtn.onclick = () => {
            // 一次過清走已落架嘅，但係由用戶主動撳，唔係系統自作主張
            if (!confirm(`清走 ${goneCount} 則原站已移除嘅收藏？`)) return;
            const live = liveItemsByKey();
            for (const key of Object.keys(state.bookmarks)) {
              if (!live.has(key)) delete state.bookmarks[key];
            }
            saveBookmarks();
            renderAccordion();
            renderHeader();
            renderCards();
          };
        }
        messagesEl.querySelector('#bm-clear').onclick = () => {
          if (!confirm(`確定清空全部 ${items.length} 則收藏？呢個動作復原唔到。`)) return;
          state.bookmarks = {};
          saveBookmarks();
          renderAccordion();
          renderHeader();
          renderCards();
        };
      } else if (!items.length) {
        const branchHint = state.branch !== 'ALL'
          ? `<br><small>目前只顯示「${escapeHtml(state.branch)}」支部。冇 PDF 內文資料嘅舊通告只能靠標題判斷支部，可以撳「全部」再睇。</small>`
          : '';
        messagesEl.innerHTML = `<div class="msg">這個來源在目前時間視窗 / 搜尋條件下暫時沒有資料。${branchHint}</div>`;
        return;
      }

      for (const item of items) {
        const href = item.url || item.pdf_url || '#';
        let host = '';
        try { host = new URL(href).hostname; } catch (_) {}

        // 查 enrich 補充資料（截止 / 對象 / 費用）
        const ex = state.enrich[item.pdf_url] || state.enrich[item.url] || null;
        let extraHtml = '';
        if (ex) {
          const rows = [];
          if (ex.deadline) rows.push(`<div class="ex-row"><span class="ex-ico ex-deadline">⏳</span>截止：${escapeHtml(ex.deadline)}</div>`);
          if (ex.audience) rows.push(`<div class="ex-row"><span class="ex-ico ex-aud">👤</span>對象：${escapeHtml(ex.audience)}</div>`);
          if (ex.fee)      rows.push(`<div class="ex-row"><span class="ex-ico ex-fee">💲</span>費用：${escapeHtml(ex.fee)}</div>`);
          if (rows.length) extraHtml = `<div class="ex-box">${rows.join('')}</div>`;
        }

        const starred = isBookmarked(item);
        const card = document.createElement('article');
        card.className = `card${item._bmGone ? ' bm-gone' : ''}`;
        card.innerHTML = `
          <div class="badge">${escapeHtml(item.source_site || state.activeSource || '')}</div>
          ${item._bmGone ? '<div class="gone-tag">⚠️ 原站已移除（報唔到，可撳 ★ 取消收藏）</div>' : ''}
          <div class="card-head">
            <h3>${escapeHtml(item.title || '未命名通告')}</h3>
            <button class="star-btn${starred ? ' on' : ''}" type="button"
              aria-pressed="${starred ? 'true' : 'false'}"
              title="${starred ? '取消收藏' : '加入收藏'}"
              aria-label="${starred ? '取消收藏' : '加入收藏'}">${starred ? '★' : '☆'}</button>
          </div>
          <div class="meta-row">
            <span>${escapeHtml(formatDate(item.date || item.captured_date || ''))}</span>
            <span class="host">${escapeHtml(host)}</span>
          </div>
          ${extraHtml}
          <div class="meta-row">
            <span>${escapeHtml(item.region || '')}</span>
            <a class="link" href="${escapeHtml(shareUrlFor(item) || href)}" target="_blank" rel="noopener noreferrer">開啟附件</a>
          </div>
          <div class="card-actions">
            <button class="ss-import" data-ss-url="${escapeHtml(buildScoutSystemImportUrl(item, ex))}">加入 ScoutSystem</button>
            <button class="share-btn" type="button" title="分享呢張通告" aria-label="分享呢張通告">${SHARE_SVG.share}<span>分享</span></button>
          </div>
        `;
        const shareBtn = card.querySelector('.share-btn');
        if (shareBtn) shareBtn.onclick = () => openShare(item);
        const starBtn = card.querySelector('.star-btn');
        if (starBtn) {
          starBtn.onclick = () => {
            const nowOn = toggleBookmark(item);
            if (state.activeSource === 'BOOKMARKS') {
              renderCards();          // 喺收藏夾撳 ★ = 移除，即刻消失
            } else {
              starBtn.classList.toggle('on', nowOn);
              starBtn.textContent = nowOn ? '★' : '☆';
              starBtn.setAttribute('aria-pressed', nowOn ? 'true' : 'false');
              starBtn.title = nowOn ? '取消收藏' : '加入收藏';
              starBtn.setAttribute('aria-label', starBtn.title);
            }
            renderAccordion();        // 側欄數字即時更新
            renderWindowChips();      // ★ 收藏分頁掣上面嘅數字都要跟住郁
            renderHeader();
          };
        }

        const ssBtn = card.querySelector('.ss-import');
        if (ssBtn) {
          ssBtn.onclick = () => {
            const target = ssBtn.getAttribute('data-ss-url') || '';
            if (!getScoutSystemUrl()) {
              alert('請先在上方設定你的 ScoutSystem 網址，例如 https://troop-portal.vercel.app');
              document.getElementById('scoutsystem-url')?.focus();
              return;
            }
            if (target) window.open(target, '_blank');
          };
        }
        cardsEl.appendChild(card);
      }
    }

    function pickDefaultSource() {
      const firstNonEmpty = state.sourceOrder.find(source => sourceCount(source) > 0);
      state.activeSource = 'ALL_SOURCES';
    }

    async function loadCache() {
      messagesEl.innerHTML = '<div class="msg">正在從 GitHub Raw CDN 讀取最新 cache.json…</div>';
      try {
        const resp = await fetch(getRawUrl(), { cache: 'no-store' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        state.cache = await resp.json();

        await loadEnrich();  // 載入截止/對象/費用補充資料

        state.grouped = state.cache.data && Object.keys(state.cache.data).length
          ? state.cache.data
          : buildGroupedFromFlat(state.cache.notices || []);

        state.regions = deriveRegions(state.grouped, state.cache?._meta?.regions || {});
        state.sourceOrder = state.cache?._meta?.source_order?.length
          ? state.cache._meta.source_order
          : Object.keys(state.grouped);

        for (const source of Object.keys(state.grouped)) {
          if (!state.sourceOrder.includes(source)) state.sourceOrder.push(source);
        }

        pickDefaultSource();
        renderSidebarMeta();
        renderAccordion();
        renderWindowChips();
        renderHeader();
        renderCards();
      } catch (err) {
        messagesEl.innerHTML = `<div class="msg error">讀取 GitHub Raw cache.json 失敗：${escapeHtml(err.message || String(err))}</div>`;
      }
    }

    $('#keyword').addEventListener('input', (e) => {
      state.keyword = e.target.value.trim();
      renderHeader();
      renderCards();

    $('#district-search').addEventListener('input', (e) => {
      state.searchRegionKeyword = e.target.value || '';
      renderAccordion();
    });

    function initScoutSystemConnect() {
      const input = document.getElementById('scoutsystem-url');
      const btn = document.getElementById('save-scoutsystem-url');
      const status = document.getElementById('scoutsystem-status');
      if (!input || !btn) return;
      input.value = getScoutSystemUrl();
      if (status) status.textContent = input.value ? `已設定：${input.value}` : '尚未設定 ScoutSystem 網址。';
      btn.onclick = () => {
        const value = String(input.value || '').trim().replace(/\/$/, '');
        if (!/^https?:\/\//.test(value)) { alert('請輸入完整網址，例如 https://troop-portal.vercel.app'); return; }
        localStorage.setItem('scoutsystem_import_base_url', value);
        if (status) status.textContent = `已設定：${value}`;
        renderCards();
      };
    }

    renderWindowChips();
    renderScopeChips();
    renderBranchChips();
    initScoutSystemConnect();
    // === 訪客計數器（純靜態頁，用免費 abacus.jasoncameron.dev，無需註冊，穩定 + CORS）===
    async function loadVisitCounter() {
      const el = document.getElementById('visit-count');
      if (!el) return;
      const NS = 'scout-circulars-hk';   // namespace（如想換新計數，改呢度）
      const KEY = 'visits';
      // 同一瀏覽器 30 分鐘內只 +1（避免重整狂刷）；其餘時間只讀取
      const last = Number(localStorage.getItem('scl_visit_ts') || 0);
      const fresh = (Date.now() - last) > 30 * 60 * 1000;
      const action = fresh ? 'hit' : 'get';
      const url = `https://abacus.jasoncameron.dev/${action}/${NS}/${KEY}`;
      try {
        const r = await fetch(url, { cache: 'no-store' });
        const d = await r.json();
        if (fresh) localStorage.setItem('scl_visit_ts', String(Date.now()));
        const n = (d && typeof d.value === 'number') ? d.value : null;
        el.textContent = n != null ? `累計瀏覽 ${n.toLocaleString()} 次` : '累計瀏覽 —';
      } catch (_) {
        // 服務掛咗都唔影響個站，但保留個框並顯示「—」（你話想睇到個位）
        el.textContent = '累計瀏覽 —';
      }
    }
    loadVisitCounter();

    state.bookmarks = loadBookmarks();
    loadCache();
