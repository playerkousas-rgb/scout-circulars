<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>全港童軍通告自動化圖書館 v5.0</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #dbe2ee;
      --text: #112033;
      --muted: #607089;
      --brand: #0f5ad7;
      --brand-2: #eff5ff;
      --accent: #1f8f5f;
      --danger: #a23434;
      --shadow: 0 10px 30px rgba(16, 35, 60, .08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, #f4f6fa 100%);
      color: var(--text);
    }
    a { color: var(--brand); text-decoration: none; }
    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(10px);
      padding: 20px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .brand {
      padding: 12px 12px 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
    }
    .brand h1 {
      font-size: 20px;
      line-height: 1.35;
      margin: 0 0 8px;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .meta-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      margin: 14px 0;
      box-shadow: var(--shadow);
    }
    .meta-box .big {
      font-weight: 800;
      font-size: 18px;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .meta-grid div {
      background: #f8fbff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .meta-grid strong {
      display: block;
      font-size: 16px;
      margin-bottom: 2px;
    }
    .accordion {
      display: grid;
      gap: 10px;
    }
    .region {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    .region > button {
      width: 100%;
      padding: 12px 14px;
      border: 0;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .region > button:hover { background: #f8fbff; }
    .region.open > button { background: var(--brand-2); color: var(--brand); }
    .source-list {
      display: none;
      padding: 0 8px 10px;
      gap: 8px;
    }
    .region.open .source-list { display: grid; }
    .source-btn {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }
    .source-btn:hover { background: #f8fbff; }
    .source-btn.active {
      border-color: #b9cef8;
      background: var(--brand-2);
      color: var(--brand);
      font-weight: 700;
    }
    .source-btn small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }
    .content {
      padding: 26px;
    }
    .toolbar {
      display: grid;
      gap: 14px;
      margin-bottom: 18px;
    }
    .toolbar-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .toolbar h2 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.25;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }
    .controls input[type="search"] {
      min-width: 260px;
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      background: #fff;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 13px;
      cursor: pointer;
    }
    .chip.active {
      border-color: #b9cef8;
      background: var(--brand-2);
      color: var(--brand);
      font-weight: 700;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-size: 14px;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      align-items: start;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 180px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: #ecf9f2;
      border: 1px solid #cbeedc;
      border-radius: 999px;
      padding: 6px 10px;
    }
    .card h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.45;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .card-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }
    .empty, .error {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .error {
      border-color: #f2cbcb;
      background: #fff8f8;
      color: var(--danger);
    }
    code {
      background: #eff3fa;
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 12px;
    }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .content { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>全港童軍通告自動化圖書館 v5.0</h1>
        <p>來源隔離 + 物理對齊。每個區會獨立分頁，互不污染。</p>
      </div>
      <div class="meta-box" id="sidebar-meta">
        <div class="big">讀取中…</div>
        <div class="status">等待 GitHub Raw cache.json</div>
      </div>
      <div class="accordion" id="accordion"></div>
    </aside>

    <main class="content">
      <section class="toolbar">
        <div class="toolbar-card">
          <h2 id="page-title">載入中…</h2>
          <div class="subtitle" id="page-subtitle">正在從 GitHub Raw CDN 讀取資料。</div>

          <div class="controls">
            <input id="search" type="search" placeholder="搜尋目前分頁標題…">
            <label class="toggle"><input id="explicit-date" type="checkbox"> 只顯示明確日期</label>
          </div>

          <div class="controls">
            <div class="chips" id="window-chips"></div>
          </div>

          <div class="status" id="run-status"></div>
        </div>
      </section>

      <section id="messages"></section>
      <section class="cards" id="cards"></section>
    </main>
  </div>

  <script>
    const RAW_CACHE_URL = "https://raw.githubusercontent.com/YOUR_GITHUB_USER/YOUR_REPO/main/cache.json";
    const TIME_WINDOWS = [
      { id: '7d', label: '7天', days: 7 },
      { id: '15d', label: '15天', days: 15 },
      { id: '30d', label: '30天', days: 30 },
      { id: '90d', label: '3個月', days: 90 },
      { id: '180d', label: '6個月', days: 180 },
      { id: 'all', label: '全部', days: null },
    ];

    const state = {
      cache: null,
      activeSource: null,
      search: '',
      explicitDateOnly: false,
      windowId: '30d',
    };

    const $ = (sel) => document.querySelector(sel);
    const cardsEl = $('#cards');
    const messagesEl = $('#messages');
    const accordionEl = $('#accordion');

    function getRawUrl() {
      const params = new URLSearchParams(location.search);
      const raw = params.get('raw') || RAW_CACHE_URL;
      if (!raw || raw.includes('YOUR_GITHUB_USER') || raw.includes('YOUR_REPO')) {
        return null;
      }
      return `${raw}${raw.includes('?') ? '&' : '?'}t=${Date.now()}`;
    }

    function parseDate(value) {
      if (!value) return null;
      const m = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
      const d = new Date(`${m[1]}-${m[2]}-${m[3]}T00:00:00+08:00`);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function formatDate(value) {
      const d = parseDate(value);
      if (!d) return '日期不明';
      return `${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function inWindow(itemDate, windowId) {
      const cfg = TIME_WINDOWS.find(x => x.id === windowId);
      if (!cfg || cfg.days === null) return true;
      const d = parseDate(itemDate);
      if (!d) return false;
      const now = new Date();
      const diff = now.getTime() - d.getTime();
      return diff <= cfg.days * 24 * 60 * 60 * 1000;
    }

    function validDate(item) {
      return !!parseDate(item?.date || item?.captured_date || null);
    }

    function sortItems(items) {
      return [...items].sort((a, b) => {
        const da = parseDate(a.date || a.captured_date);
        const db = parseDate(b.date || b.captured_date);
        const ta = da ? da.getTime() : -Infinity;
        const tb = db ? db.getTime() : -Infinity;
        if (tb !== ta) return tb - ta;
        return String(a.title || '').localeCompare(String(b.title || ''), 'zh-Hant');
      });
    }

    function getCurrentItems() {
      const bucket = state.cache?.data?.[state.activeSource] || [];
      let items = bucket.filter(item => {
        if (state.explicitDateOnly && !validDate(item)) return false;
        if (!inWindow(item.date || item.captured_date, state.windowId)) return false;
        if (state.search) {
          return String(item.title || '').toLowerCase().includes(state.search.toLowerCase());
        }
        return true;
      });
      return sortItems(items);
    }

    function renderWindowChips() {
      const wrap = $('#window-chips');
      wrap.innerHTML = '';
      for (const win of TIME_WINDOWS) {
        const btn = document.createElement('button');
        btn.className = `chip ${state.windowId === win.id ? 'active' : ''}`;
        btn.textContent = win.label;
        btn.onclick = () => {
          state.windowId = win.id;
          renderWindowChips();
          renderCards();
        };
        wrap.appendChild(btn);
      }
    }

    function countSourceItems(source) {
      return (state.cache?.data?.[source] || []).length;
    }

    function renderAccordion() {
      const meta = state.cache?._meta || {};
      const regions = meta.regions || {};
      const order = meta.source_order || Object.keys(state.cache?.data || {});
      accordionEl.innerHTML = '';

      const orderedRegions = Object.keys(regions).sort((a, b) => {
        const ai = order.indexOf(regions[a][0]);
        const bi = order.indexOf(regions[b][0]);
        return ai - bi;
      });

      for (const regionName of orderedRegions) {
        const regionEl = document.createElement('section');
        regionEl.className = 'region';
        const firstSources = regions[regionName] || [];
        const shouldOpen = firstSources.includes(state.activeSource);
        if (shouldOpen) regionEl.classList.add('open');

        const header = document.createElement('button');
        header.innerHTML = `<span>${regionName}</span><span>${firstSources.length} 個分頁</span>`;
        header.onclick = () => regionEl.classList.toggle('open');
        regionEl.appendChild(header);

        const list = document.createElement('div');
        list.className = 'source-list';

        for (const source of firstSources) {
          const btn = document.createElement('button');
          btn.className = `source-btn ${state.activeSource === source ? 'active' : ''}`;
          btn.innerHTML = `<span>${source}</span><small>${countSourceItems(source)} 則</small>`;
          btn.onclick = () => {
            state.activeSource = source;
            renderAccordion();
            renderHeader();
            renderCards();
          };
          list.appendChild(btn);
        }

        regionEl.appendChild(list);
        accordionEl.appendChild(regionEl);
      }
    }

    function renderSidebarMeta() {
      const meta = state.cache?._meta || {};
      const sources = meta.source_order || Object.keys(state.cache?.data || {});
      const totalItems = sources.reduce((acc, source) => acc + countSourceItems(source), 0);
      const nonEmpty = sources.filter(source => countSourceItems(source) > 0).length;
      $('#sidebar-meta').innerHTML = `
        <div class="big">${meta.project || 'Scout Notice Library'}</div>
        <div class="status">最後更新：${state.cache?.last_updated || '未有資料'}</div>
        <div class="meta-grid">
          <div><strong>${sources.length}</strong><span>來源</span></div>
          <div><strong>${nonEmpty}</strong><span>有資料</span></div>
          <div><strong>${totalItems}</strong><span>通告</span></div>
        </div>
      `;
    }

    function renderHeader() {
      const total = countSourceItems(state.activeSource);
      const current = getCurrentItems().length;
      $('#page-title').textContent = state.activeSource || '未選擇來源';
      $('#page-subtitle').textContent = `只讀取 data["${state.activeSource}"]；切換分頁時只排序本來源陣列。`;
      $('#run-status').innerHTML = `
        視窗：<code>${TIME_WINDOWS.find(x => x.id === state.windowId)?.label || state.windowId}</code>
        ・目前顯示：<code>${current}</code>
        ・本來源總數：<code>${total}</code>
        ・最後更新：<code>${state.cache?.last_updated || '未有資料'}</code>
      `;
    }

    function renderCards() {
      messagesEl.innerHTML = '';
      cardsEl.innerHTML = '';

      const items = getCurrentItems();
      if (!state.activeSource) {
        messagesEl.innerHTML = '<div class="empty">請先選擇左側分頁。</div>';
        return;
      }
      if (!items.length) {
        messagesEl.innerHTML = '<div class="empty">這個分頁在目前時間視窗或搜尋條件下沒有資料。</div>';
        return;
      }

      for (const item of items) {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="badge">${item.source_site || state.activeSource}</div>
          <h3>${escapeHtml(item.title || '未命名通告')}</h3>
          <p>系統捕獲日期：${formatDate(item.date || item.captured_date)}</p>
          <div class="card-footer">
            <span>${item.url ? new URL(item.url).hostname : ''}</span>
            <a href="${item.url}" target="_blank" rel="noopener noreferrer">開啟 PDF</a>
          </div>
        `;
        cardsEl.appendChild(card);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function pickDefaultSource() {
      const order = state.cache?._meta?.source_order || Object.keys(state.cache?.data || {});
      const firstNonEmpty = order.find(name => countSourceItems(name) > 0);
      state.activeSource = firstNonEmpty || order[0] || null;
    }

    async function loadCache() {
      const rawUrl = getRawUrl();
      if (!rawUrl) {
        messagesEl.innerHTML = `
          <div class="error">
            尚未設定 GitHub Raw CDN。<br><br>
            請修改 <code>RAW_CACHE_URL</code>，或以 query 參數傳入：<br>
            <code>?raw=https://raw.githubusercontent.com/&lt;user&gt;/&lt;repo&gt;/main/cache.json</code>
          </div>
        `;
        return;
      }

      try {
        const res = await fetch(rawUrl, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        state.cache = await res.json();
        pickDefaultSource();
        renderSidebarMeta();
        renderAccordion();
        renderHeader();
        renderWindowChips();
        renderCards();
      } catch (err) {
        messagesEl.innerHTML = `<div class="error">讀取 GitHub Raw cache.json 失敗：${escapeHtml(err.message || String(err))}</div>`;
      }
    }

    $('#search').addEventListener('input', (e) => {
      state.search = e.target.value.trim();
      renderCards();
      renderHeader();
    });

    $('#explicit-date').addEventListener('change', (e) => {
      state.explicitDateOnly = e.target.checked;
      renderCards();
      renderHeader();
    });

    renderWindowChips();
    loadCache();
  </script>
</body>
</html>
